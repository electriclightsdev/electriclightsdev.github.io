<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>· · · ● · · ● · · · · · · · · ●  · · · · · · · · ●</title>
  <link rel="icon" type="image/png" href="assets/icon2.gif">
  
  <script>
    // Check if the user specifically requested the desktop version
    const urlParams = new URLSearchParams(window.location.search);
    const forceDesktop = urlParams.has('desktop');

    if (!forceDesktop) {
      // Detect mobile devices based on User-Agent OR very small screen widths
      const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const isSmallScreen = window.innerWidth <= 768;

      if (isMobileDevice || isSmallScreen) {
        // Redirect them to the new mobile page
        window.location.replace("mobile.html");
      }
    }
  </script>

  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── WARM PALETTE — pops against the blue-purple bg ── */
      --gold:     #ffaa00;
      --coral:    #ff4466;
      --white:    #ffffff;
      --green:    #00ff00;          /* kept for audio status */
      --dark:     rgba(4, 0, 14, 0.90);
      --border:   rgba(255, 170, 0, 0.35);
      --glow-g:   rgba(255, 170, 0, 0.20);
      --glow-r:   rgba(255, 68,  102, 0.20);
    }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: #04000e url('BA1CK.png') center center / cover fixed no-repeat;
      color: var(--gold);
      font-family: "Courier New", Courier, monospace;
      cursor: url('assets/mouse.png'), auto;
    }
    a { cursor: url('assets/mouse.png'), pointer; text-decoration: none; }

    /* ── SCROLLBARS ── */
    ::-webkit-scrollbar { width: 20px; }
    ::-webkit-scrollbar-track { background: #111; border-left: 3px inset #808080; }
    ::-webkit-scrollbar-thumb {
      background-color: var(--coral);
      border-top: 3px solid #ffaacc; border-left: 3px solid #ffaacc;
      border-bottom: 3px solid #880022; border-right: 3px solid #880022;
    }
    ::-webkit-scrollbar-button {
      background-color: #c0c0c0; height: 20px;
      border-top: 3px solid #fff; border-left: 3px solid #fff;
      border-bottom: 3px solid #808080; border-right: 3px solid #808080;
    }

    /* ── SCANLINES ── */
    #scanlines {
      position: fixed; inset: 0; z-index: 9990; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, transparent 0, transparent 2px,
        rgba(0,0,0,0.20) 2px, rgba(0,0,0,0.20) 4px
      );
    }

    /* ── SPARKLES ── */
    .sparkle {
      position: fixed; width: 5px; height: 5px;
      background: var(--gold); box-shadow: 0 0 6px var(--gold);
      border-radius: 50%; pointer-events: none; z-index: 9999;
    }

    /* ── TITLE ── */
    #site-title {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 100; white-space: nowrap; text-align: center;
      pointer-events: none;
    }
    #site-title h1 {
      font-size: clamp(1.1rem, 3vw, 2rem); color: var(--white);
      text-shadow: 3px 3px var(--coral), 0 0 28px var(--gold);
      letter-spacing: 6px; text-transform: uppercase;
      animation: title-glitch 9s infinite;
    }
    #site-title .sub {
      display: inline-block;
      font-size: 9px;
      color: rgba(255,220,140,0.9);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-top: 5px;
      padding: 3px 14px 3px;
      background: rgba(4, 0, 14, 0.72);
      border-top: 1px solid rgba(255,170,0,0.25);
      border-bottom: 1px solid rgba(255,170,0,0.25);
      text-shadow: 0 0 10px rgba(255,170,0,0.4);
    }
    @keyframes title-glitch {
      0%,90%,100% { transform:translate(0); filter:none; }
      91%  { transform:translate(-3px,1px);  filter:hue-rotate(30deg); }
      92%  { transform:translate(3px,-1px);  filter:hue-rotate(-30deg) brightness(1.6); }
      93%  { transform:translate(0);         filter:none; }
      97%  { transform:translate(2px,2px);   filter:hue-rotate(20deg); }
      98%  { transform:translate(0);         filter:none; }
    }

    /* ── BEST VIEWED ── */
    #best-viewed {
      position: fixed; top: 12px; right: 14px; z-index: 100;
      opacity: 0.5; image-rendering: pixelated; width: 150px;
      transition: opacity 0.2s;
    }
    #best-viewed:hover { opacity: 1; }

    /* ── TOOLTIP ── */
    #tooltip {
      position: fixed; z-index: 9980; pointer-events: none;
      background: rgba(4,0,14,0.95); color: var(--gold);
      border: 1px solid var(--coral);
      padding: 3px 8px; font-size: 11px; font-weight: bold;
      letter-spacing: 2px; text-transform: uppercase;
      white-space: nowrap; box-shadow: 0 0 10px var(--glow-r);
      opacity: 0; transition: opacity 0.12s;
      transform: translate(14px, -50%);
    }
    #tooltip.visible { opacity: 1; }

    /* ============================================================
       PANEL BASE
       ============================================================ */
    .panel {
      position: fixed;
      background: var(--dark);
      border: 1px solid var(--border);
      box-shadow:
        0 0 14px var(--glow-g),
        0 0 45px rgba(0,0,0,0.7),
        inset 0 0 22px rgba(255,170,0,0.03);
      z-index: 50;
      overflow: hidden;
      user-select: none;
      transition: width 0.32s cubic-bezier(0.4,0,0.2,1);
    }

    /* shimmer */
    .panel::after {
      content: ''; position: absolute; top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,170,0,0.05), transparent);
      animation: shimmer 8s ease-in-out infinite; pointer-events: none;
    }
    @keyframes shimmer { to { left: 160%; } }

    /* corner brackets */
    .panel .c { position: absolute; width: 12px; height: 12px; z-index: 2; }
    .panel .c.tl { top:-1px; left:-1px;  border-top:2px solid var(--gold); border-left:2px solid var(--gold); }
    .panel .c.tr { top:-1px; right:-1px; border-top:2px solid var(--gold); border-right:2px solid var(--gold); }
    .panel .c.bl { bottom:-1px; left:-1px;  border-bottom:2px solid var(--gold); border-left:2px solid var(--gold); }
    .panel .c.br { bottom:-1px; right:-1px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold); }

    /* ── UNIFIED PANEL HEADER ── */
    /* Matches the meme / audio style: dot + small-caps label */
    .panel-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 10px 6px;
      border-bottom: 1px solid rgba(255,170,0,0.18);
      cursor: grab;
    }
    .panel-bar:active { cursor: grabbing; }

    .bar-left { display: flex; align-items: center; gap: 8px; }

    .bar-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: var(--gold); box-shadow: 0 0 7px var(--gold);
      animation: dot-pulse 2.2s ease-in-out infinite;
    }
    @keyframes dot-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.7)} }

    .bar-label {
      font-size: 9px; letter-spacing: 3px; color: var(--gold);
      text-shadow: 0 0 10px var(--gold); text-transform: uppercase;
    }

    /* coral accent variant for socials */
    .bar-dot.coral   { background: var(--coral); box-shadow: 0 0 7px var(--coral); }
    .bar-label.coral { color: var(--coral); text-shadow: 0 0 10px var(--coral); }

    /* minimize button */
    .min-btn {
      background: none; border: 1px solid rgba(255,170,0,0.3);
      color: var(--gold); font-family: inherit; font-size: 12px; font-weight: bold;
      width: 20px; height: 18px; display: flex; align-items: center; justify-content: center;
      cursor: url('assets/mouse.png'), pointer;
      transition: all 0.15s; flex-shrink: 0; padding: 0; line-height: 1;
    }
    .min-btn:hover { background: rgba(255,170,0,0.12); border-color: var(--gold); box-shadow: 0 0 8px var(--glow-g); }
    .min-btn.coral  { border-color: rgba(255,68,102,0.35); color: var(--coral); }
    .min-btn.coral:hover { background: rgba(255,68,102,0.12); border-color: var(--coral); box-shadow: 0 0 8px var(--glow-r); }

    /* ── PANEL BODY COLLAPSE ── */
    .panel-body {
      overflow: hidden;
      max-height: 700px;
      transition: max-height 0.32s cubic-bezier(0.4,0,0.2,1),
                  opacity 0.22s ease,
                  padding 0.32s cubic-bezier(0.4,0,0.2,1);
      opacity: 1;
    }
    /* !important overrides inline padding on the element */
    .panel.minimized .panel-body {
      max-height: 0 !important;
      opacity: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }
    .panel.minimized .panel-bar { border-bottom: none; }

    /* ============================================================
       SOCIALS PANEL
       ============================================================ */
    #panel-socials {
      top: 72px; left: 50%; transform: translateX(-50%);
      width: 560px;
      border-color: rgba(255,68,102,0.35);
      box-shadow: 0 0 16px var(--glow-r), 0 0 45px rgba(0,0,0,0.7),
                  inset 0 0 22px rgba(255,68,102,0.03);
    }
    #panel-socials .c { border-color: var(--coral); }
    #panel-socials::after {
      background: linear-gradient(90deg, transparent, rgba(255,68,102,0.05), transparent);
    }

    .socials-header { display: block; margin: 0 auto 10px; max-width: 100%; image-rendering: pixelated; }

    .stream-links {
      display: flex; flex-wrap: wrap;
      justify-content: center; align-items: center; gap: 14px;
    }
    .stream-links a {
      display: flex; align-items: center; justify-content: center;
      height: 85px; position: relative;
      transition: transform 0.2s, filter 0.2s;
    }
    .stream-links img { width: auto; image-rendering: pixelated; }
    .stream-links img.sz-spotify { height: 85px; }
    .stream-links img.sz-apple   { height: 72px; }
    .stream-links img.sz-youtube { height: 48px; }
    .stream-links img.sz-insta   { height: 52px; }
    .stream-links img.sz-tiktok  { height: 62px; }
    .stream-links img.sz-twitter { height: 66px; }
    .stream-links img.sz-fb      { height: 74px; }
    .stream-links a:hover {
      transform: scale(1.12) translateY(-4px);
      filter: drop-shadow(0 0 10px var(--coral));
    }

    /* ============================================================
       PORTALS PANEL
       ============================================================ */
    #panel-portals { bottom: 48px; left: 18px; width: 490px; }

    .gif-portals {
      display: flex; flex-wrap: wrap;
      justify-content: center; align-items: flex-end; gap: 16px;
    }
    .gif-portals a {
      display: inline-block; position: relative;
      transition: transform 0.2s, filter 0.2s;
    }
    .gif-portals img { max-height: 88px; width: auto; image-rendering: pixelated; }
    .gif-portals a:hover {
      transform: scale(1.12) translateY(-6px);
      filter: drop-shadow(0 0 12px var(--gold));
    }

    /* ============================================================
       MEME VIEWER
       ============================================================ */
    #panel-meme { top: 82px; right: 18px; width: 265px; }

    .meme-display { position: relative; overflow: hidden; background: #000; }
    .meme-display img {
      width: 100%; height: 190px;
      object-fit: contain;       /* ← fits whole image, no crop */
      display: block;
      filter: contrast(1.05) saturate(1.1);
      transition: filter 0.3s;
      cursor: url('assets/mouse.png'), zoom-in;
    }
    .meme-display img:hover { filter: contrast(1.15) saturate(1.25) brightness(1.05); }
    .meme-display::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, transparent 0, transparent 3px,
        rgba(0,0,0,0.16) 3px, rgba(0,0,0,0.16) 4px
      );
    }
    .meme-corner {
      position: absolute; font-size: 7px;
      color: rgba(255,170,0,0.55); letter-spacing: 1px;
      pointer-events: none; z-index: 2;
    }
    .meme-corner.tl { top:5px; left:6px; }
    .meme-corner.tr { top:5px; right:6px; }
    .meme-corner.bl { bottom:5px; left:6px; }
    .meme-corner.br { bottom:5px; right:6px; }

    .meme-footer {
      padding: 7px 12px 9px; border-top: 1px solid rgba(255,170,0,0.14);
      font-size: 8px; color: rgba(255,170,0,0.45);
      letter-spacing: 2px; text-transform: uppercase;
    }

    /* ── meme dot colour override ── */
    #panel-meme .bar-dot  { background: var(--coral); box-shadow: 0 0 7px var(--coral); }
    #panel-meme .bar-label { color: var(--coral); text-shadow: 0 0 10px var(--coral); }

    /* ============================================================
       AUDIO PLAYER
       ============================================================ */
    #panel-audio { bottom: 48px; right: 18px; width: 265px; }

    .audio-right { display: flex; align-items: center; gap: 8px; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #333; transition: all 0.3s;
    }
    .status-dot.on {
      background: var(--green);
      box-shadow: 0 0 8px var(--green), 0 0 16px var(--green);
      animation: sblink 1s ease-in-out infinite;
    }
    @keyframes sblink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .eq-stage {
      padding: 12px 14px 6px;
      display: flex; align-items: flex-end; justify-content: center;
      gap: 5px; height: 72px;
      border-bottom: 1px solid rgba(255,170,0,0.1);
    }
    .eq-bar {
      flex: 1; height: 3px; max-width: 22px;
      background: linear-gradient(to top, var(--green) 0%, var(--gold) 60%, var(--coral) 100%);
      box-shadow: 0 0 4px var(--green);
      border-radius: 1px 1px 0 0; transform-origin: bottom;
    }
    #panel-audio.is-playing .eq-bar:nth-child(1) { animation: eq 0.45s ease-in-out infinite alternate; --h:46px; }
    #panel-audio.is-playing .eq-bar:nth-child(2) { animation: eq 0.30s ease-in-out infinite alternate; --h:58px; }
    #panel-audio.is-playing .eq-bar:nth-child(3) { animation: eq 0.55s ease-in-out infinite alternate; --h:36px; }
    #panel-audio.is-playing .eq-bar:nth-child(4) { animation: eq 0.25s ease-in-out infinite alternate; --h:62px; }
    #panel-audio.is-playing .eq-bar:nth-child(5) { animation: eq 0.40s ease-in-out infinite alternate; --h:50px; }
    #panel-audio.is-playing .eq-bar:nth-child(6) { animation: eq 0.35s ease-in-out infinite alternate; --h:42px; }
    #panel-audio.is-playing .eq-bar:nth-child(7) { animation: eq 0.50s ease-in-out infinite alternate; --h:55px; }
    #panel-audio.is-playing .eq-bar:nth-child(8) { animation: eq 0.28s ease-in-out infinite alternate; --h:38px; }
    @keyframes eq { to { height: var(--h, 40px); } }

    .track-display { padding: 10px 14px 8px; border-bottom: 1px solid rgba(255,170,0,0.1); }
    .track-name {
      color: var(--green); font-size: 10px; letter-spacing: 2px;
      text-shadow: 0 0 8px var(--green); white-space: nowrap; overflow: hidden;
    }
    .track-name.scrolling span { display: inline-block; animation: tscroll 8s linear infinite; }
    @keyframes tscroll { 0%{transform:translateX(100%)} 100%{transform:translateX(-100%)} }
    .track-sub { font-size: 8px; color: rgba(255,170,0,0.4); letter-spacing: 2px; margin-top: 4px; }

    .waveform { height: 18px; margin-top: 8px; display: flex; align-items: center; gap: 2px; }
    .wv-bar { flex: 1; background: rgba(0,255,0,0.2); border-radius: 1px; transition: background 0.3s; }
    #panel-audio.is-playing .wv-bar {
      background: rgba(0,255,0,0.5);
      animation: wvanim var(--s,0.5s) ease-in-out infinite alternate;
    }
    @keyframes wvanim { to { transform: scaleY(var(--sy,3)); } }

    .audio-controls { padding: 10px 14px 12px; display: flex; justify-content: center; gap: 14px; }
    .ctl-btn {
      background: transparent; border: 1px solid rgba(255,170,0,0.35);
      color: var(--gold); width: 42px; height: 42px; border-radius: 50%;
      font-size: 14px; cursor: url('assets/mouse.png'), pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; box-shadow: 0 0 6px rgba(255,170,0,0.12);
      font-family: inherit;
    }
    .ctl-btn:hover { border-color: var(--gold); background: rgba(255,170,0,0.1); box-shadow: 0 0 14px var(--gold); color: #fff; }
    .ctl-btn:active { transform: scale(0.93); }
    .ctl-btn.play-btn { border-color:rgba(0,255,0,0.5); color:var(--green); }
    .ctl-btn.play-btn:hover { border-color:var(--green); background:rgba(0,255,0,0.1); box-shadow:0 0 14px var(--green); }
    .ctl-btn.stop-btn { border-color:rgba(255,68,102,0.5); color:var(--coral); }
    .ctl-btn.stop-btn:hover { border-color:var(--coral); background:rgba(255,68,102,0.1); box-shadow:0 0 14px var(--coral); }

    /* ============================================================
       88x31 TICKER
       ============================================================ */
    #ticker {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 44px;
      z-index: 60; background: rgba(4,0,14,0.93);
      border-top: 1px solid var(--border);
      overflow: hidden; display: flex; align-items: center;
    }
    #ticker::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 200%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--coral), transparent);
      animation: tickerline 4s linear infinite;
    }
    @keyframes tickerline { from{transform:translateX(-50%)} to{transform:translateX(0)} }
    .ticker-track {
      display: flex; gap: 8px; align-items: center;
      animation: tickscroll 35s linear infinite; width: max-content;
    }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes tickscroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
    .ticker-track a { display: inline-block; flex-shrink: 0; }
    .eighty-eight {
      width: 88px; height: 31px; border: 1px solid rgba(255,170,0,0.3);
      image-rendering: pixelated; display: block; transition: border-color 0.15s, filter 0.15s;
    }
    .eighty-eight:hover { border-color: var(--white); filter: brightness(1.2); }

    /* ============================================================
       AMBIENT GIFS
       ============================================================ */
    .ambient-gif {
      position: fixed; image-rendering: pixelated;
      z-index: 20; cursor: url('assets/mouse.png'), pointer;
      transition: filter 0.2s, opacity 0.2s; opacity: 0.93;
    }
    .ambient-gif:hover {
      opacity: 1; z-index: 30;
      filter: drop-shadow(0 0 8px var(--gold)) brightness(1.18);
    }

    @keyframes bob         { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes sway        { 0%,100%{transform:translateX(0) rotate(-2deg)} 50%{transform:translateX(14px) rotate(2deg)} }
    @keyframes shake       { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px) rotate(-3deg)} 75%{transform:translateX(4px) rotate(3deg)} }
    @keyframes pulse       { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
    @keyframes floatRotate { 0%{transform:translateY(0) rotate(0deg)} 33%{transform:translateY(-16px) rotate(7deg)} 66%{transform:translateY(-7px) rotate(-5deg)} 100%{transform:translateY(0) rotate(0deg)} }
    @keyframes blinkBob    { 0%{opacity:1;transform:translateY(0)} 40%{opacity:0.2;transform:translateY(-5px)} 60%{opacity:1;transform:translateY(-5px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes spinDrift   { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes bounce      { from{transform:translateY(0)} to{transform:translateY(-18px)} }

    /* ============================================================
       VIDEO POPUP
       ============================================================ */
    #video-popup {
      display: none; position: fixed; z-index: 5000;
      width: 480px; top: 20vh; left: 50%; transform: translateX(-50%);
      background: var(--dark); border: 1px solid var(--border);
      box-shadow: 0 0 20px var(--glow-g), 0 0 60px rgba(0,0,0,0.8);
    }
    .vp-bar {
      padding: 7px 10px; background: rgba(255,170,0,0.05);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      cursor: move; user-select: none;
    }
    .vp-title { font-size: 10px; letter-spacing: 3px; color: var(--gold); text-shadow: 0 0 8px var(--gold); text-transform: uppercase; }
    .vp-close {
      background: none; border: 1px solid rgba(255,0,0,0.5); color: #ff4444;
      font-size: 11px; font-weight: bold; padding: 1px 7px;
      cursor: url('assets/mouse.png'), pointer; font-family: inherit; letter-spacing: 1px; transition: all 0.15s;
    }
    .vp-close:hover { background: rgba(255,0,0,0.2); border-color: #ff4444; box-shadow: 0 0 8px rgba(255,0,0,0.5); }
    .vp-screen { width: 100%; aspect-ratio: 16/9; background: #000; }
    .vp-screen iframe, .vp-screen video { width: 100%; height: 100%; border: none; display: block; }
    #video-popup .c { position:absolute; width:12px; height:12px; }
    #video-popup .c.tl { top:-1px; left:-1px;  border-top:2px solid var(--gold); border-left:2px solid var(--gold); }
    #video-popup .c.tr { top:-1px; right:-1px; border-top:2px solid var(--gold); border-right:2px solid var(--gold); }
    #video-popup .c.bl { bottom:-1px; left:-1px;  border-bottom:2px solid var(--gold); border-left:2px solid var(--gold); }
    #video-popup .c.br { bottom:-1px; right:-1px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold); }

    /* ============================================================
       IMAGE LIGHTBOX
       ============================================================ */
    #img-lightbox {
      display: none; position: fixed; inset: 0; z-index: 4000;
      background: rgba(0,0,0,0.92);
      align-items: center; justify-content: center;
    }
    #img-lightbox.open { display: flex; }

    .lb-frame { position: relative; display: inline-flex; flex-direction: column; align-items: stretch; }

    .lb-toolbar {
      display: flex; background: rgba(4,0,14,0.95);
      border: 1px solid var(--border); border-bottom: none;
    }
    .lb-btn {
      background: none; border: none; border-right: 1px solid rgba(255,170,0,0.2);
      color: var(--gold); font-family: inherit; font-size: 10px;

    (function() {
      const wv = document.getElementById('waveform');
      for (let i = 0; i < 28; i++) {
        const b = document.createElement('div');
        b.className = 'wv-bar';
        b.style.cssText = `height:${Math.floor(Math.random()*12)+3}px;`
          + `--s:${(Math.random()*0.4+0.3).toFixed(2)}s;`
          + `--sy:${(Math.random()*2.5+1.5).toFixed(1)};`;
        wv.appendChild(b);
      }
    })();

    // ── PANEL MINIMIZE ─────────────────────────────────────────
    function togglePanel(id, btn) {
      const panel = document.getElementById(id);
      const bar   = panel.querySelector('.panel-bar');
      const minimized = panel.classList.toggle('minimized');

      btn.textContent = minimized ? '+' : '−';
      btn.title = minimized ? 'restore' : 'minimize';

      if (minimized) {
        // Store current rendered width, then shrink to bar's natural content width
        panel.dataset.origWidth = panel.offsetWidth + 'px';
        panel.style.width = bar.scrollWidth + 'px';
      } else {
        panel.style.width = panel.dataset.origWidth || '';
      }
    }

    // ── DRAGGABLE PANELS ───────────────────────────────────────
    // Works for all .panel elements — drag via their .panel-bar
    document.querySelectorAll('.panel').forEach(panel => {
      const bar = panel.querySelector('[data-drag-handle]');
      if (!bar) return;

      let dragging = false, ox = 0, oy = 0;

      bar.addEventListener('mousedown', e => {
        // Don't start drag if clicking the minimize button
        if (e.target.classList.contains('min-btn')) return;

        dragging = true;
        const r = panel.getBoundingClientRect();

        // Remove any CSS-based centering (e.g. transform on socials)
        panel.style.transform = 'none';
        // Convert bottom/right to top/left so we can move freely
        panel.style.left   = r.left + 'px';
        panel.style.top    = r.top  + 'px';
        panel.style.right  = 'auto';
        panel.style.bottom = 'auto';

        ox = e.clientX - r.left;
        oy = e.clientY - r.top;
        panel.style.zIndex = '200'; // bring to front while dragging
        e.preventDefault();
      });

      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        panel.style.left = (e.clientX - ox) + 'px';
        panel.style.top  = (e.clientY - oy) + 'px';
      });

      document.addEventListener('mouseup', () => {
        if (dragging) {
          dragging = false;
          panel.style.zIndex = '50';
        }
      });
    });

    // ── AUDIO PLAYER ───────────────────────────────────────────
    const tape       = document.getElementById('tape-audio');
    const trackName  = document.getElementById('track-name');
    const trackSub   = document.getElementById('track-sub');
    const statusDot  = document.getElementById('status-dot');
    const audioPanel = document.getElementById('panel-audio');

    const playlist = [
      { label:'NEON_VOID',          file:'NEON_VOID.mp3' },
      { label:'SYSTEM_CRASH_REMIX', file:'SYSTEM_CRASH_REMIX.mp3' },
      { label:'VIRTUAL_TEARS',      file:'VIRTUAL_TEARS.mp3' }
    ];
    let currentTrack = 0;
    tape.src = playlist[0].file;

    function setPlaying(on) {
      audioPanel.classList.toggle('is-playing', on);
      statusDot.classList.toggle('on', on);
      trackName.classList.toggle('scrolling', on);
    }
    function playTape() {
      tape.play();
      trackName.innerHTML = `<span>${playlist[currentTrack].label}.MP3</span>`;
      trackSub.innerText  = '// PLAYING //';
      setPlaying(true);
    }
    function pauseTape() {
      tape.pause();
      trackName.innerHTML = playlist[currentTrack].label + '.MP3';
      trackSub.innerText  = '// PAUSED //';
      setPlaying(false);
    }
    function stopTape() {
      tape.pause(); tape.currentTime = 0;
      trackName.innerHTML = 'TAPE STOPPED';
      trackSub.innerText  = '// SELECT TRACK //';
      setPlaying(false);
    }
    tape.onended = function() {
      currentTrack = (currentTrack + 1) % playlist.length;
      tape.src = playlist[currentTrack].file;
      playTape();
    };

    // ── TOOLTIP ────────────────────────────────────────────────
    const tooltip = document.getElementById('tooltip');
    document.querySelectorAll('#panel-portals [data-title], #panel-socials [data-title]').forEach(el => {
      el.addEventListener('mouseenter', () => { tooltip.textContent = el.dataset.title; tooltip.classList.add('visible'); });
      el.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
    });
    document.addEventListener('mousemove', e => {
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top  = e.clientY + 'px';
    });

    // ── AMBIENT GIF CLICKS ─────────────────────────────────────
    document.querySelectorAll('.ambient-gif').forEach(gif => {
      gif.addEventListener('click', function() {
        const type = this.dataset.type, src = this.dataset.src;
        if (!type || !src) return;
        if (type === 'url')      window.open(src, '_blank');
        if (type === 'internal') window.location.href = src;
        if (type === 'image')    openLightbox(src);
        if (type === 'video')    openVideo(src);
      });
    });

    // ── VIDEO POPUP ────────────────────────────────────────────
    const videoPopup = document.getElementById('video-popup');
    const vpScreen   = document.getElementById('vp-screen');

    function openVideo(src) {
      vpScreen.innerHTML = '';
      const ytMatch = src.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      let el;
      if (ytMatch) {
        el = document.createElement('iframe');
        el.src = `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1`;
        el.allow = 'autoplay; encrypted-media'; el.allowFullscreen = true;
      } else {
        el = document.createElement('video');
        el.src = src; el.controls = true; el.autoplay = true;
      }
      vpScreen.appendChild(el);
      videoPopup.style.display = 'block';
    }
    function closeVideo() { videoPopup.style.display = 'none'; vpScreen.innerHTML = ''; }

    (function() {
      const bar = document.getElementById('vp-drag-bar');
      let drag = false, ox = 0, oy = 0;
      bar.addEventListener('mousedown', e => {
        drag = true;
        const r = videoPopup.getBoundingClientRect();
        videoPopup.style.transform = 'none';
        videoPopup.style.left = r.left + 'px'; videoPopup.style.top = r.top + 'px';
        ox = e.clientX - r.left; oy = e.clientY - r.top; e.preventDefault();
      });
      document.addEventListener('mousemove', e => { if (!drag) return; videoPopup.style.left = (e.clientX-ox)+'px'; videoPopup.style.top = (e.clientY-oy)+'px'; });
      document.addEventListener('mouseup', () => { drag = false; });
    })();

    // ── IMAGE LIGHTBOX ─────────────────────────────────────────
    const lightbox    = document.getElementById('img-lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lbMaxBtn    = document.getElementById('lb-max-btn');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightboxImg.classList.remove('maximized');
      lbMaxBtn.textContent = '⤢ MAXIMIZE';
      lightbox.classList.add('open');
    }
    function closeLightbox() { lightbox.classList.remove('open'); }
    function toggleMaximize() {
      const isMax = lightboxImg.classList.toggle('maximized');
      lbMaxBtn.textContent = isMax ? '⤡ RESTORE' : '⤢ MAXIMIZE';
    }
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    // ── SPARKLE TRAIL ──────────────────────────────────────────
    const TRAIL = 12, dots = [];
    let mx = innerWidth/2, my = innerHeight/2;
    for (let i = 0; i < TRAIL; i++) {
      const d = document.createElement('div');
      d.className = 'sparkle'; document.body.appendChild(d);
      dots.push({ el: d, x: mx, y: my });
    }
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    (function anim() {
      let tx = mx, ty = my;
      dots.forEach((dot, i) => {
        dot.x += (tx-dot.x)*0.3; dot.y += (ty-dot.y)*0.3;
        dot.el.style.left = dot.x+'px'; dot.el.style.top = dot.y+'px';
        dot.el.style.transform = `scale(${(TRAIL-i)/TRAIL})`;
        tx = dot.x; ty = dot.y;
      });
      requestAnimationFrame(anim);
    })();
  </script>
</body>
</html>
