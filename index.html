<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>· · · ● · · ● · · · · · · · · ●  · · · · · · · · ●</title>
  <link rel="icon" type="image/png" href="assets/icon2.gif">
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:    #00ffff;
      --magenta: #ff00ff;
      --green:   #00ff00;
      --dark:    rgba(4, 0, 18, 0.91);
      --border:  rgba(0, 255, 255, 0.28);
      --glow-c:  rgba(0, 255, 255, 0.18);
      --glow-m:  rgba(255, 0, 255, 0.18);
    }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: #04000f url('BA1CK.png') center center / cover fixed no-repeat;
      color: var(--cyan);
      font-family: "Courier New", Courier, monospace;
      cursor: url('assets/mouse.png'), auto;
    }
    a { cursor: url('assets/mouse.png'), pointer; text-decoration: none; }

    /* ── SCROLLBARS ── */
    ::-webkit-scrollbar { width: 20px; }
    ::-webkit-scrollbar-track { background: #111; border-left: 3px inset #808080; }
    ::-webkit-scrollbar-thumb {
      background-color: var(--magenta);
      border-top: 3px solid #ffccff; border-left: 3px solid #ffccff;
      border-bottom: 3px solid #800080; border-right: 3px solid #800080;
    }
    ::-webkit-scrollbar-button {
      background-color: #c0c0c0; height: 20px;
      border-top: 3px solid #fff; border-left: 3px solid #fff;
      border-bottom: 3px solid #808080; border-right: 3px solid #808080;
    }

    /* ── SCANLINES ── */
    #scanlines {
      position: fixed; inset: 0; z-index: 9990; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, transparent 0, transparent 2px,
        rgba(0,0,0,0.22) 2px, rgba(0,0,0,0.22) 4px
      );
    }

    /* ── SPARKLES ── */
    .sparkle {
      position: fixed; width: 5px; height: 5px;
      background: var(--green); box-shadow: 0 0 5px var(--green);
      border-radius: 50%; pointer-events: none; z-index: 9999;
    }

    /* ── TITLE ── */
    #site-title {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 100; white-space: nowrap; text-align: center;
    }
    #site-title h1 {
      font-size: clamp(1.1rem, 3vw, 2rem); color: var(--cyan);
      text-shadow: 3px 3px var(--magenta), 0 0 22px var(--cyan);
      letter-spacing: 6px; text-transform: uppercase;
      animation: title-glitch 9s infinite;
    }
    #site-title .sub {
      font-size: 10px; color: rgba(255,255,255,0.35);
      letter-spacing: 4px; text-transform: uppercase; margin-top: 2px;
    }
    @keyframes title-glitch {
      0%,90%,100% { transform:translate(0); filter:none; }
      91%  { transform:translate(-3px,1px);  filter:hue-rotate(90deg); }
      92%  { transform:translate(3px,-1px);  filter:hue-rotate(-90deg) brightness(1.5); }
      93%  { transform:translate(0);         filter:none; }
      97%  { transform:translate(2px,2px);   filter:hue-rotate(45deg); }
      98%  { transform:translate(0);         filter:none; }
    }

    /* ── BEST VIEWED ── */
    #best-viewed {
      position: fixed; top: 12px; right: 14px; z-index: 100;
      opacity: 0.55; image-rendering: pixelated; width: 150px;
      transition: opacity 0.2s;
    }
    #best-viewed:hover { opacity: 1; }

    /* ── MOUSE-FOLLOWING TOOLTIP ── */
    #tooltip {
      position: fixed; z-index: 9980; pointer-events: none;
      background: #000080; color: var(--green);
      border: 1px solid var(--magenta);
      padding: 3px 8px; font-size: 11px; font-weight: bold;
      letter-spacing: 2px; text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 0 8px var(--glow-m);
      opacity: 0; transition: opacity 0.12s;
      transform: translate(14px, -50%);
    }
    #tooltip.visible { opacity: 1; }

    /* ============================================================
       PANEL BASE
       ============================================================ */
    .panel {
      position: fixed;
      background: var(--dark);
      border: 1px solid var(--border);
      box-shadow: 0 0 12px var(--glow-c), 0 0 40px rgba(0,0,0,0.65),
                  inset 0 0 20px rgba(0,255,255,0.03);
      z-index: 50; overflow: hidden;
    }

    .panel::after {
      content: ''; position: absolute; top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,255,255,0.04), transparent);
      animation: shimmer 7s ease-in-out infinite; pointer-events: none;
    }
    @keyframes shimmer { to { left: 160%; } }

    /* corner brackets */
    .panel .c { position: absolute; width: 14px; height: 14px; }
    .panel .c.tl { top:-1px;    left:-1px;  border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); }
    .panel .c.tr { top:-1px;    right:-1px; border-top:2px solid var(--cyan); border-right:2px solid var(--cyan); }
    .panel .c.bl { bottom:-1px; left:-1px;  border-bottom:2px solid var(--cyan); border-left:2px solid var(--cyan); }
    .panel .c.br { bottom:-1px; right:-1px; border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan); }

    .panel-label {
      color: var(--cyan); text-shadow: 2px 2px var(--magenta);
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    }

    /* ── MINIMIZE SYSTEM ── */

    /* Every panel gets a thin header bar for the minimize button */
    .panel-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px 5px;
      border-bottom: 1px solid rgba(0,255,255,0.15);
      cursor: default;
    }

    /* The collapsible body */
    .panel-body {
      overflow: hidden;
      max-height: 600px; /* large enough for any panel */
      transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1),
                  padding 0.35s ease,
                  opacity 0.25s ease;
      opacity: 1;
    }

    .panel.minimized .panel-body {
      max-height: 0;
      opacity: 0;
    }

    /* Minimize button */
    .min-btn {
      background: none;
      border: 1px solid rgba(0,255,255,0.35);
      color: var(--cyan); font-family: inherit;
      font-size: 11px; font-weight: bold;
      width: 20px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: url('assets/mouse.png'), pointer;
      transition: all 0.15s; flex-shrink: 0;
      padding: 0; line-height: 1;
    }
    .min-btn:hover {
      background: rgba(0,255,255,0.12);
      border-color: var(--cyan);
      box-shadow: 0 0 8px var(--glow-c);
    }

    /* ============================================================
       SOCIALS PANEL
       ============================================================ */
    #panel-socials {
      top: 72px; left: 50%; transform: translateX(-50%);
      width: 560px;
      border-color: rgba(255,0,255,0.3);
      box-shadow: 0 0 16px var(--glow-m), 0 0 45px rgba(0,0,0,0.7),
                  inset 0 0 22px rgba(255,0,255,0.03);
    }
    #panel-socials .c { border-color: var(--magenta); }
    #panel-socials::after {
      background: linear-gradient(90deg, transparent, rgba(255,0,255,0.04), transparent);
    }
    #panel-socials .min-btn { border-color: rgba(255,0,255,0.4); color: var(--magenta); }
    #panel-socials .min-btn:hover { background: rgba(255,0,255,0.12); border-color: var(--magenta); box-shadow: 0 0 8px var(--glow-m); }

    .socials-header { display: block; margin: 0 auto 10px; max-width: 100%; image-rendering: pixelated; }

    .stream-links {
      display: flex; flex-wrap: wrap;
      justify-content: center; align-items: center; gap: 14px;
    }
    .stream-links a {
      display: flex; align-items: center; justify-content: center;
      height: 85px; position: relative;
      transition: transform 0.2s, filter 0.2s;
    }
    .stream-links img { width: auto; image-rendering: pixelated; }
    .stream-links img.sz-spotify { height: 85px; }
    .stream-links img.sz-apple   { height: 72px; }
    .stream-links img.sz-youtube { height: 48px; }
    .stream-links img.sz-insta   { height: 52px; }
    .stream-links img.sz-tiktok  { height: 62px; }
    .stream-links img.sz-twitter { height: 66px; }
    .stream-links img.sz-fb      { height: 74px; }
    .stream-links a:hover {
      transform: scale(1.12) translateY(-4px);
      filter: drop-shadow(0 0 10px var(--magenta));
    }

    /* ============================================================
       PORTALS PANEL
       ============================================================ */
    #panel-portals { bottom: 48px; left: 18px; width: 490px; }

    .gif-portals {
      display: flex; flex-wrap: wrap;
      justify-content: center; align-items: flex-end; gap: 16px;
    }
    .gif-portals a {
      display: inline-block; position: relative;
      transition: transform 0.2s, filter 0.2s;
    }
    .gif-portals img { max-height: 88px; width: auto; image-rendering: pixelated; }
    .gif-portals a:hover {
      transform: scale(1.12) translateY(-6px);
      filter: drop-shadow(0 0 12px var(--magenta));
    }

    /* ============================================================
       MEME VIEWER
       ============================================================ */
    #panel-meme { top: 82px; right: 18px; width: 265px; }

    .meme-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }

    .meme-dot-wrap { display: flex; align-items: center; gap: 8px; }

    .meme-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--cyan); box-shadow: 0 0 6px var(--cyan);
      animation: dot-pulse 2s ease-in-out infinite; flex-shrink: 0;
    }
    @keyframes dot-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.7)} }

    .meme-label {
      font-size: 9px; letter-spacing: 3px; color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan); text-transform: uppercase;
      animation: label-glitch 6s infinite;
    }
    @keyframes label-glitch {
      0%,94%,100% { opacity:1; transform:none; }
      95% { opacity:0.4; transform:skewX(-8deg); }
      96% { opacity:1; transform:none; }
    }

    .meme-display { position: relative; overflow: hidden; background: #000; }
    .meme-display img {
      width: 100%; height: 190px; object-fit: cover; display: block;
      filter: contrast(1.05) saturate(1.1); transition: filter 0.3s;
    }
    .meme-display img:hover { filter: contrast(1.15) saturate(1.25) brightness(1.05); }
    .meme-display::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, transparent 0, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
    }

    .meme-corner {
      position: absolute; font-size: 7px;
      color: rgba(0,255,255,0.5); letter-spacing: 1px;
      pointer-events: none; z-index: 2;
    }
    .meme-corner.tl { top:5px; left:6px; }
    .meme-corner.tr { top:5px; right:6px; text-align:right; }
    .meme-corner.bl { bottom:5px; left:6px; }
    .meme-corner.br { bottom:5px; right:6px; }

    .meme-footer {
      padding: 7px 12px 9px;
      border-top: 1px solid rgba(0,255,255,0.12);
      font-size: 8px; color: rgba(0,255,255,0.5);
      letter-spacing: 2px; text-transform: uppercase;
    }

    /* ============================================================
       AUDIO PLAYER
       ============================================================ */
    #panel-audio { bottom: 48px; right: 18px; width: 265px; }

    .audio-header {
      display: flex; justify-content: space-between; align-items: center;
    }

    .audio-title {
      font-size: 9px; letter-spacing: 3px; color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan); text-transform: uppercase;
    }

    .audio-right { display: flex; align-items: center; gap: 8px; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #333; box-shadow: 0 0 4px #333; transition: all 0.3s;
    }
    .status-dot.on {
      background: var(--green);
      box-shadow: 0 0 8px var(--green), 0 0 16px var(--green);
      animation: sblink 1s ease-in-out infinite;
    }
    @keyframes sblink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .eq-stage {
      padding: 12px 14px 6px;
      display: flex; align-items: flex-end; justify-content: center;
      gap: 5px; height: 72px;
      border-bottom: 1px solid rgba(0,255,255,0.1);
    }
    .eq-bar {
      flex: 1; height: 3px; max-width: 22px;
      background: linear-gradient(to top, var(--green) 0%, var(--cyan) 60%, var(--magenta) 100%);
      box-shadow: 0 0 4px var(--green);
      border-radius: 1px 1px 0 0; transform-origin: bottom;
    }
    #panel-audio.is-playing .eq-bar:nth-child(1) { animation: eq 0.45s ease-in-out infinite alternate; --h:46px; }
    #panel-audio.is-playing .eq-bar:nth-child(2) { animation: eq 0.30s ease-in-out infinite alternate; --h:58px; }
    #panel-audio.is-playing .eq-bar:nth-child(3) { animation: eq 0.55s ease-in-out infinite alternate; --h:36px; }
    #panel-audio.is-playing .eq-bar:nth-child(4) { animation: eq 0.25s ease-in-out infinite alternate; --h:62px; }
    #panel-audio.is-playing .eq-bar:nth-child(5) { animation: eq 0.40s ease-in-out infinite alternate; --h:50px; }
    #panel-audio.is-playing .eq-bar:nth-child(6) { animation: eq 0.35s ease-in-out infinite alternate; --h:42px; }
    #panel-audio.is-playing .eq-bar:nth-child(7) { animation: eq 0.50s ease-in-out infinite alternate; --h:55px; }
    #panel-audio.is-playing .eq-bar:nth-child(8) { animation: eq 0.28s ease-in-out infinite alternate; --h:38px; }
    @keyframes eq { to { height: var(--h, 40px); } }

    .track-display {
      padding: 10px 14px 8px;
      border-bottom: 1px solid rgba(0,255,255,0.1);
    }
    .track-name {
      color: var(--green); font-size: 10px; letter-spacing: 2px;
      text-shadow: 0 0 8px var(--green);
      white-space: nowrap; overflow: hidden;
    }
    .track-name.scrolling span { display: inline-block; animation: tscroll 8s linear infinite; }
    @keyframes tscroll { 0%{transform:translateX(100%)} 100%{transform:translateX(-100%)} }

    .track-sub { font-size: 8px; color: rgba(0,255,255,0.4); letter-spacing: 2px; margin-top: 4px; }

    .waveform { height: 18px; margin-top: 8px; display: flex; align-items: center; gap: 2px; }
    .wv-bar { flex: 1; background: rgba(0,255,0,0.22); border-radius: 1px; transition: background 0.3s; }
    #panel-audio.is-playing .wv-bar {
      background: rgba(0,255,0,0.55);
      animation: wvanim var(--s,0.5s) ease-in-out infinite alternate;
    }
    @keyframes wvanim { to { transform: scaleY(var(--sy,3)); } }

    .audio-controls { padding: 10px 14px 12px; display: flex; justify-content: center; gap: 14px; }

    .ctl-btn {
      background: transparent; border: 1px solid rgba(0,255,255,0.4);
      color: var(--cyan); width: 42px; height: 42px;
      border-radius: 50%; font-size: 14px;
      cursor: url('assets/mouse.png'), pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; box-shadow: 0 0 6px rgba(0,255,255,0.15);
      font-family: inherit;
    }
    .ctl-btn:hover {
      border-color: var(--cyan); background: rgba(0,255,255,0.1);
      box-shadow: 0 0 14px var(--cyan), inset 0 0 8px rgba(0,255,255,0.1); color: #fff;
    }
    .ctl-btn:active { background: rgba(0,255,255,0.2); transform: scale(0.93); }
    .ctl-btn.play-btn { border-color:rgba(0,255,0,0.5); color:var(--green); box-shadow:0 0 6px rgba(0,255,0,0.2); }
    .ctl-btn.play-btn:hover { border-color:var(--green); background:rgba(0,255,0,0.1); box-shadow:0 0 14px var(--green); }
    .ctl-btn.stop-btn { border-color:rgba(255,0,100,0.5); color:#ff0055; }
    .ctl-btn.stop-btn:hover { border-color:#ff0055; background:rgba(255,0,100,0.1); box-shadow:0 0 14px #ff0055; }

    /* ============================================================
       88x31 TICKER
       ============================================================ */
    #ticker {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 44px;
      z-index: 60; background: rgba(4,0,18,0.92);
      border-top: 1px solid var(--border);
      overflow: hidden; display: flex; align-items: center;
    }
    #ticker::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 200%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
      animation: tickerline 4s linear infinite;
    }
    @keyframes tickerline { from{transform:translateX(-50%)} to{transform:translateX(0)} }

    .ticker-track {
      display: flex; gap: 8px; align-items: center;
      animation: tickscroll 35s linear infinite; width: max-content;
    }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes tickscroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
    .ticker-track a { display: inline-block; flex-shrink: 0; }
    .eighty-eight {
      width: 88px; height: 31px; border: 1px solid rgba(0,255,0,0.3);
      image-rendering: pixelated; display: block; transition: border-color 0.15s, filter 0.15s;
    }
    .eighty-eight:hover { border-color: #fff; filter: brightness(1.2); }

    /* ============================================================
       AMBIENT GIFS  —  opacity raised to 0.92
       ============================================================ */
    .ambient-gif {
      position: fixed; image-rendering: pixelated;
      z-index: 20; cursor: url('assets/mouse.png'), pointer;
      transition: filter 0.2s, opacity 0.2s;
      opacity: 0.92;
    }
    .ambient-gif:hover {
      opacity: 1; z-index: 30;
      filter: drop-shadow(0 0 8px var(--cyan)) brightness(1.18);
    }

    @keyframes bob         { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes sway        { 0%,100%{transform:translateX(0) rotate(-2deg)} 50%{transform:translateX(14px) rotate(2deg)} }
    @keyframes shake       { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px) rotate(-3deg)} 75%{transform:translateX(4px) rotate(3deg)} }
    @keyframes pulse       { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
    @keyframes floatRotate { 0%{transform:translateY(0) rotate(0deg)} 33%{transform:translateY(-16px) rotate(7deg)} 66%{transform:translateY(-7px) rotate(-5deg)} 100%{transform:translateY(0) rotate(0deg)} }
    @keyframes blinkBob    { 0%{opacity:1;transform:translateY(0)} 40%{opacity:0.2;transform:translateY(-5px)} 60%{opacity:1;transform:translateY(-5px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes spinDrift   { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes bounce      { from{transform:translateY(0)} to{transform:translateY(-18px)} }

    /* ============================================================
       VIDEO POPUP
       ============================================================ */
    #video-popup {
      display: none; position: fixed; z-index: 5000;
      width: 480px; top: 20vh; left: 50%; transform: translateX(-50%);
      background: var(--dark); border: 1px solid var(--border);
      box-shadow: 0 0 20px var(--glow-c), 0 0 60px rgba(0,0,0,0.8);
    }
    .vp-bar {
      padding: 7px 10px; background: rgba(0,255,255,0.06);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      cursor: move; user-select: none;
    }
    .vp-title {
      font-size: 10px; letter-spacing: 3px;
      color: var(--cyan); text-shadow: 0 0 8px var(--cyan); text-transform: uppercase;
    }
    .vp-close {
      background: none; border: 1px solid rgba(255,0,0,0.5);
      color: #ff4444; font-size: 11px; font-weight: bold;
      padding: 1px 7px; cursor: url('assets/mouse.png'), pointer;
      font-family: inherit; letter-spacing: 1px; transition: all 0.15s;
    }
    .vp-close:hover { background: rgba(255,0,0,0.2); border-color: #ff4444; box-shadow: 0 0 8px rgba(255,0,0,0.5); }
    .vp-screen { width: 100%; aspect-ratio: 16/9; background: #000; }
    .vp-screen iframe, .vp-screen video { width: 100%; height: 100%; border: none; display: block; }
    #video-popup .c { position:absolute; width:12px; height:12px; }
    #video-popup .c.tl { top:-1px; left:-1px;  border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); }
    #video-popup .c.tr { top:-1px; right:-1px; border-top:2px solid var(--cyan); border-right:2px solid var(--cyan); }
    #video-popup .c.bl { bottom:-1px; left:-1px;  border-bottom:2px solid var(--cyan); border-left:2px solid var(--cyan); }
    #video-popup .c.br { bottom:-1px; right:-1px; border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan); }

    /* ============================================================
       IMAGE LIGHTBOX  —  with maximize support
       ============================================================ */
    #img-lightbox {
      display: none; position: fixed; inset: 0; z-index: 4000;
      background: rgba(0,0,0,0.92);
      align-items: center; justify-content: center;
    }
    #img-lightbox.open { display: flex; }

    /* wrapper so toolbar can sit on top of image */
    .lb-frame {
      position: relative; display: inline-flex;
      flex-direction: column; align-items: stretch;
    }

    .lb-toolbar {
      display: flex; gap: 0; z-index: 2;
      background: rgba(4,0,18,0.92);
      border: 1px solid var(--border);
      border-bottom: none;
    }

    .lb-btn {
      background: none; border: none;
      border-right: 1px solid rgba(0,255,255,0.2);
      color: var(--cyan); font-family: inherit; font-size: 10px;
      letter-spacing: 2px; padding: 6px 14px;
      cursor: url('assets/mouse.png'), pointer;
      transition: all 0.15s; text-transform: uppercase;
      white-space: nowrap;
    }
    .lb-btn:last-child { border-right: none; }
    .lb-btn:hover {
      background: rgba(0,255,255,0.12);
      color: #fff; box-shadow: inset 0 0 10px var(--glow-c);
    }
    .lb-btn.close-btn { color: #ff4444; }
    .lb-btn.close-btn:hover { background: rgba(255,0,0,0.15); color: #ff6666; }

    #lightbox-img {

  <script>
    // ── MEME DATE ──────────────────────────────────────────────
    (function() {
      const opts = { weekday:'short', year:'numeric', month:'short', day:'numeric' };
      const str  = new Date().toLocaleDateString('en-US', opts).toUpperCase();
      document.getElementById('meme-date-corner').innerText = str.slice(0,6);
      document.getElementById('meme-footer').innerText = 'LOGGED: ' + str;
    })();

    // ── WAVEFORM BARS ──────────────────────────────────────────
    (function() {
      const wv = document.getElementById('waveform');
      for (let i = 0; i < 28; i++) {
        const b = document.createElement('div');
        b.className = 'wv-bar';
        b.style.cssText = `height:${Math.floor(Math.random()*12)+3}px;`
          + `--s:${(Math.random()*0.4+0.3).toFixed(2)}s;`
          + `--sy:${(Math.random()*2.5+1.5).toFixed(1)};`;
        wv.appendChild(b);
      }
    })();

    // ── PANEL MINIMIZE ─────────────────────────────────────────
    function togglePanel(id, btn) {
      const panel = document.getElementById(id);
      const minimized = panel.classList.toggle('minimized');
      btn.textContent = minimized ? '+' : '−';
      btn.title = minimized ? 'restore' : 'minimize';
    }

    // ── AUDIO PLAYER ───────────────────────────────────────────
    const tape       = document.getElementById('tape-audio');
    const trackName  = document.getElementById('track-name');
    const trackSub   = document.getElementById('track-sub');
    const statusDot  = document.getElementById('status-dot');
    const audioPanel = document.getElementById('panel-audio');

    const playlist = [
      { label:'NEON_VOID',          file:'NEON_VOID.mp3' },
      { label:'SYSTEM_CRASH_REMIX', file:'SYSTEM_CRASH_REMIX.mp3' },
      { label:'VIRTUAL_TEARS',      file:'VIRTUAL_TEARS.mp3' }
    ];
    let currentTrack = 0;
    tape.src = playlist[0].file;

    function setPlaying(on) {
      audioPanel.classList.toggle('is-playing', on);
      statusDot.classList.toggle('on', on);
      trackName.classList.toggle('scrolling', on);
    }

    function playTape() {
      tape.play();
      trackName.innerHTML = `<span>${playlist[currentTrack].label}.MP3</span>`;
      trackSub.innerText  = '// PLAYING //';
      setPlaying(true);
    }
    function pauseTape() {
      tape.pause();
      trackName.innerHTML = playlist[currentTrack].label + '.MP3';
      trackSub.innerText  = '// PAUSED //';
      setPlaying(false);
    }
    function stopTape() {
      tape.pause(); tape.currentTime = 0;
      trackName.innerHTML = 'TAPE STOPPED';
      trackSub.innerText  = '// SELECT TRACK //';
      setPlaying(false);
    }
    tape.onended = function() {
      currentTrack = (currentTrack + 1) % playlist.length;
      tape.src = playlist[currentTrack].file;
      playTape();
    };

    // ── MOUSE-FOLLOWING TOOLTIP ────────────────────────────────
    const tooltip = document.getElementById('tooltip');
    let tooltipTargets = [];

    function initTooltips() {
      // Apply to all elements with data-title inside portals and socials panels
      tooltipTargets = document.querySelectorAll(
        '#panel-portals [data-title], #panel-socials [data-title]'
      );

      tooltipTargets.forEach(el => {
        el.addEventListener('mouseenter', () => {
          tooltip.textContent = el.dataset.title;
          tooltip.classList.add('visible');
        });
        el.addEventListener('mouseleave', () => {
          tooltip.classList.remove('visible');
        });
      });
    }

    document.addEventListener('mousemove', e => {
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top  = e.clientY + 'px';
    });

    initTooltips();

    // ── AMBIENT GIF CLICKS ─────────────────────────────────────
    document.querySelectorAll('.ambient-gif').forEach(gif => {
      gif.addEventListener('click', function() {
        const type = this.dataset.type;
        const src  = this.dataset.src;
        if (!type || !src) return;
        if (type === 'url')      window.open(src, '_blank');
        if (type === 'internal') window.location.href = src;
        if (type === 'image')    openLightbox(src);
        if (type === 'video')    openVideo(src);
      });
    });

    // ── VIDEO POPUP ────────────────────────────────────────────
    const videoPopup = document.getElementById('video-popup');
    const vpScreen   = document.getElementById('vp-screen');

    function openVideo(src) {
      vpScreen.innerHTML = '';
      const ytMatch = src.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      let el;
      if (ytMatch) {
        el = document.createElement('iframe');
        el.src = `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1`;
        el.allow = 'autoplay; encrypted-media';
        el.allowFullscreen = true;
      } else {
        el = document.createElement('video');
        el.src = src; el.controls = true; el.autoplay = true;
      }
      vpScreen.appendChild(el);
      videoPopup.style.display = 'block';
    }
    function closeVideo() {
      videoPopup.style.display = 'none';
      vpScreen.innerHTML = '';
    }

    // Draggable video popup
    (function() {
      const bar = document.getElementById('vp-drag-bar');
      let drag = false, ox = 0, oy = 0;
      bar.addEventListener('mousedown', e => {
        drag = true;
        const r = videoPopup.getBoundingClientRect();
        videoPopup.style.transform = 'none';
        videoPopup.style.left = r.left + 'px';
        videoPopup.style.top  = r.top  + 'px';
        ox = e.clientX - r.left; oy = e.clientY - r.top;
        e.preventDefault();
      });
      document.addEventListener('mousemove', e => {
        if (!drag) return;
        videoPopup.style.left = (e.clientX - ox) + 'px';
        videoPopup.style.top  = (e.clientY - oy) + 'px';
      });
      document.addEventListener('mouseup', () => { drag = false; });
    })();

    // ── IMAGE LIGHTBOX ─────────────────────────────────────────
    const lightbox    = document.getElementById('img-lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lbMaxBtn    = document.getElementById('lb-max-btn');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightboxImg.classList.remove('maximized');
      lbMaxBtn.textContent = '[ MAXIMIZE ]';
      lightbox.classList.add('open');
    }
    function closeLightbox() { lightbox.classList.remove('open'); }

    function toggleMaximize() {
      const isMax = lightboxImg.classList.toggle('maximized');
      lbMaxBtn.textContent = isMax ? '[ RESTORE ]' : '[ MAXIMIZE ]';
    }

    // Close lightbox on backdrop click (not toolbar/image)
    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox) closeLightbox();
    });

    // ── SPARKLE TRAIL ──────────────────────────────────────────
    const TRAIL = 12, dots = [];
    let mx = innerWidth/2, my = innerHeight/2;
    for (let i = 0; i < TRAIL; i++) {
      const d = document.createElement('div');
      d.className = 'sparkle'; document.body.appendChild(d);
      dots.push({ el: d, x: mx, y: my });
    }
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    (function anim() {
      let tx = mx, ty = my;
      dots.forEach((dot, i) => {
        dot.x += (tx - dot.x) * 0.3; dot.y += (ty - dot.y) * 0.3;
        dot.el.style.left = dot.x + 'px'; dot.el.style.top = dot.y + 'px';
        dot.el.style.transform = `scale(${(TRAIL-i)/TRAIL})`;
        tx = dot.x; ty = dot.y;
      });
      requestAnimationFrame(anim);
    })();

  </script>
</body>
</html>
