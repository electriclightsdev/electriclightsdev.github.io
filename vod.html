<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>· · · ●  V O D  ● · · ·</title>
  <link rel="icon" type="image/png" href="assets/icon2.gif">
  
  <style>
    /* =========================================
       1. GLOBAL STYLES
       ========================================= */
    body {
      background-color: #000; 
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; 
      cursor: url('assets/mouse.png'), auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================================
       2. THE RESPONSIVE CRT RIG
       ========================================= */
    .tv-container {
      position: relative;
      /* This maintains the 16:9 shape of your background image */
      width: 100%;
      max-width: 1200px; 
      aspect-ratio: 16 / 9;
      container-type: size; /* Enables container queries for text scaling */
    }

    .tv-rig {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* LAYER 1: The Video (Bottom) */
    .tv-video {
      position: absolute;
      top: 9.2%;
      left: 23.4%;
      width: 53.1%;
      height: 69.4%;
      object-fit: fill; 
      z-index: 1; 
      background-color: #000; 
    }

    /* LAYER 2: The Bezel (Middle) */
    .tv-bezel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
      pointer-events: none; 
    }

    /* =========================================
       3. INTERACTIVE HOTSPOTS
       ========================================= */
    .hotspot {
      position: absolute;
      z-index: 3;
      cursor: url('assets/mouse.png'), pointer;
      border: 1px solid transparent; 
      border-radius: 2px; /* Slightly tighter border */
    }

    .hotspot:hover {
      background-color: rgba(0, 255, 255, 0.2); 
    }

    /* Button Row Positioning - Adjust 'left' % values to align with your image */
    .btn-ch-up   { top: 85%; left: 31.8%; width: 1.8%; height: 4%; }
    .btn-ch-down { top: 85%; left: 34.0%; width: 1.8%; height: 4%; }
    .btn-vol-up  { top: 85%; left: 36.2%; width: 1.8%; height: 4%; }
    .btn-vol-down{ top: 85%; left: 38.4%; width: 1.8%; height: 4%; }
    .btn-extra   { top: 85%; left: 40.6%; width: 1.8%; height: 4%; }
    
    /* Power button, slightly larger and offset */
    .btn-power   { top: 85%; left: 43.5%; width: 2.2%; height: 4.5%; }

    /* Channel Display LED */
    .channel-display {
      position: absolute;
      top: 12%;
      right: 28%; 
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: 2.5cqw; /* Scales perfectly based on container width */
      font-weight: bold;
      text-shadow: 0 0 5px #00ff00;
      z-index: 4;
      pointer-events: none;
    }
    
    .exit-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #666666;
      background-color: #111111;
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      z-index: 10;
      padding: 8px 12px;
      opacity: 0.5;
      transition: all 0.1s;
      box-shadow: inset 2px 2px 0 #333333, inset -2px -2px 0 #000000;
    }
    
    .exit-btn:hover {
      opacity: 1;
      color: #ffffff;
      background-color: #e52521;
      box-shadow: inset 2px 2px 0 #ff6b68, inset -2px -2px 0 #8c100e;
    }
  </style>
</head>
<body>

  <a href="index.html" class="exit-btn">◀ EXIT</a>

  <div class="tv-container">
    <div class="tv-rig">
      <div id="channel-indicator" class="channel-display">CH: 01</div>

      <video id="main-screen" class="tv-video" autoplay loop muted playsinline></video>

      <img src="assets/bg/vodbg.png" class="tv-bezel" alt="Retro TV Overlay">

      <div class="hotspot btn-ch-up"    onclick="switchChannel(1)"    title="Channel Up"></div>
      <div class="hotspot btn-ch-down"  onclick="switchChannel(-1)"   title="Channel Down"></div>
      <div class="hotspot btn-vol-up"   onclick="adjustVolume(0.1)"   title="Volume Up"></div>
      <div class="hotspot btn-vol-down" onclick="adjustVolume(-0.1)"  title="Volume Down"></div>
      <div class="hotspot btn-extra"    onclick="extraFunc()"         title="Utility"></div>
      <div class="hotspot btn-power"    onclick="togglePower()"       title="Power"></div>
    </div>
  </div>

  <script>
    // --- TV SYSTEM LOGIC ---
    const tvScreen = document.getElementById("main-screen");
    const channelIndicator = document.getElementById("channel-indicator");

    const playlist = [
      "assets/videos/spire/1.mp4",
      "assets/space_cowboy_concept_animatic.mp4",
      "assets/historical_robot_sketch_timelapse.mp4"
    ];
    
    let currentChannel = 0;
    
    // 1. Core Functions
    function loadVideo() {
      tvScreen.src = playlist[currentChannel];
      tvScreen.load();
      tvScreen.play().catch(error => {
          console.log("Autoplay with sound blocked. Waiting for user interaction.");
      });
      
      let displayNum = (currentChannel + 1).toString().padStart(2, '0');
      channelIndicator.innerText = "CH: " + displayNum;
    }

    // 2. Button Event Handlers
    function switchChannel(direction) {
      // Unmute the video on first interaction, bypasses autoplay block
      tvScreen.muted = false;
      
      currentChannel += direction;
      
      if (currentChannel >= playlist.length) {
        currentChannel = 0; 
      } else if (currentChannel < 0) {
        currentChannel = playlist.length - 1;
      }
      
      loadVideo();
    }

    function adjustVolume(amount) {
        // Unmute if muted
        tvScreen.muted = false;
        
        let currentVolume = tvScreen.volume;
        let newVolume = currentVolume + amount;
        
        // Clamp volume between 0.0 and 1.0
        if (newVolume > 1.0) newVolume = 1.0;
        if (newVolume < 0.0) newVolume = 0.0;
        
        tvScreen.volume = newVolume;
        console.log("Volume adjusted to: " + (newVolume * 100).toFixed(0) + "%");
    }

    function extraFunc() {
        console.log("Utility button pressed. No function set yet.");
        // Example: Use this for a menu, a scan effect, etc.
    }

    function togglePower() {
        console.log("Power button pressed. Placeholder function.");
        // Example: Toggle visible: none on .tv-video and .channel-display
    }

    // --- INITIALIZE ---
    loadVideo();
  </script>

</body>
</html>
