<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>· · · ●  V O D  ● · · ·</title>
  <link rel="icon" type="image/png" href="assets/icon2.gif">
  
  <style>
    /* =========================================
       1. GLOBAL STYLES
       ========================================= */
    body {
      background-color: #000; 
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Locks the page so it can't scroll */
      cursor: url('assets/mouse.png'), auto; 
    }

    /* =========================================
       2. THE CRT RIG LAYER SYSTEM
       ========================================= */
    .tv-rig {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;   /* Stretches to 100% of the viewport width */
      height: 100vh;  /* Stretches to 100% of the viewport height */
    }

    /* LAYER 1: The Video (Bottom) */
    .tv-video {
      position: absolute;
      top: 9.2%;
      left: 23.4%;
      width: 53.1%;
      height: 69.4%;
      object-fit: fill; /* Forces the video to stretch with the screen */
      z-index: 1; 
      background-color: #000; 
    }

    /* LAYER 2: The Bezel (Middle) */
    .tv-bezel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill; /* Forces the image to stretch and break its aspect ratio */
      z-index: 2;
      pointer-events: none; 
    }

    /* LAYER 3: The Hotspots (Top) */
    .hotspot {
      position: absolute;
      z-index: 3;
      cursor: url('assets/mouse.png'), pointer;
      border: 1px solid transparent; 
      border-radius: 5px;
    }

    .hotspot:hover {
      background-color: rgba(0, 255, 255, 0.3); 
    }

    .btn-ch-up {
      top: 85%;
      left: 32%;
      width: 2%;
      height: 4%;
    }

    .btn-ch-down {
      top: 85%;
      left: 34.5%;
      width: 2%;
      height: 4%;
    }

    /* Channel Display LED */
    .channel-display {
      position: absolute;
      top: 12%;
      right: 29%; /* Adjusted further left so it doesn't clip off the screen */
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(14px, 2vw, 36px); 
      font-weight: bold;
      text-shadow: 0 0 5px #00ff00;
      z-index: 4;
      pointer-events: none;
    }
    
    /* Back Button Escape Hatch - 8-Bit Nintendo Style */
    .exit-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #666666; /* Subtle text */
      background-color: #111111; /* Dark background to hide in the shadows */
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      z-index: 10;
      padding: 8px 12px;
      opacity: 0.5;
      transition: all 0.1s;
      /* Simulates a chunky 8-bit border */
      box-shadow: 
        inset 2px 2px 0 #333333,
        inset -2px -2px 0 #000000;
    }
    
    .exit-btn:hover {
      opacity: 1;
      color: #ffffff;
      background-color: #e52521; /* Classic Nintendo Red */
      /* Reverses the bevel for a 'pressed' or lit-up look */
      box-shadow: 
        inset 2px 2px 0 #ff6b68,
        inset -2px -2px 0 #8c100e;
    }
  </style>
</head>
<body>

  <a href="index.html" class="exit-btn">◀ EXIT</a>

  <div class="tv-rig">
    <div id="channel-indicator" class="channel-display">CH: 01</div>

    <video id="main-screen" class="tv-video" autoplay loop muted></video>

    <img src="assets/bg/vodbg.png" class="tv-bezel" alt="Retro TV Overlay">

    <div class="hotspot btn-ch-up" onclick="switchChannel(1)" title="Channel Up"></div>
    <div class="hotspot btn-ch-down" onclick="switchChannel(-1)" title="Channel Down"></div>
  </div>

  <script>
    // --- TV SYSTEM LOGIC ---
    const tvScreen = document.getElementById("main-screen");
    const channelIndicator = document.getElementById("channel-indicator");

    // The Archive: Add your video files here
    const playlist = [
      "assets/videos/spire/1.mp4",
      "assets/space_cowboy_concept_animatic.mp4",
      "assets/historical_robot_sketch_timelapse.mp4"
    ];
    
    let currentChannel = 0;
    
    // Initialize the TV
    function loadVideo() {
      tvScreen.src = playlist[currentChannel];
      tvScreen.play();
      
      // Update the green LED display (pads with zero, e.g., "01", "02")
      let displayNum = (currentChannel + 1).toString().padStart(2, '0');
      channelIndicator.innerText = "CH: " + displayNum;
    }

    function switchChannel(direction) {
      currentChannel += direction;
      
      // Loop around if we hit the end of the tape
      if (currentChannel >= playlist.length) {
        currentChannel = 0; 
      } else if (currentChannel < 0) {
        currentChannel = playlist.length - 1;
      }
      
      loadVideo();
    }

    // Turn the TV on
    loadVideo();
  </script>

</body>
</html>
