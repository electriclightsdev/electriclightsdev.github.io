<!DOCTYPE html>
<html>
<head>
    <title>meme.exe | v1.01</title>
    <style>
        body {
            /* Path corrected to your assets folder */
            background-image: url('assets/bg/gifgallery.jpg');
            background-attachment: fixed;
            background-repeat: repeat;
            margin: 0;
            padding: 0;
            font-family: "Arial Black", Gadget, sans-serif;
            overflow-x: hidden; /* Prevents horizontal scroll from rotations */
        }

        #main-scroll-zone {
            width: 100%;
            min-height: 1000px;
            padding-bottom: 200px;
        }

        .meme-frame {
            background-color: #FFF;
            border: 5px solid #000;
            padding: 10px;
            position: relative;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            display: inline-block;
            transition: transform 0.2s;
        }

        .meme-frame:hover {
            transform: scale(1.05) !important; /* Pop effect on hover */
            z-index: 999;
        }

        .caption {
            background: #000;
            color: #00FFFF; /* Teal from your BG */
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 4px;
            text-align: center;
            border-top: 2px solid #000;
        }

        /* The Windows 95 Style Taskbar */
        #taskbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 35px;
            background: #C0C0C0;
            border-top: 2px solid #FFF;
            display: flex;
            align-items: center;
            z-index: 10000;
            box-shadow: 0px -2px 5px rgba(0,0,0,0.2);
        }

        #home-button {
            background: #C0C0C0;
            border: 2px outset #FFF;
            padding: 2px 10px;
            margin: 0 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        #counter-display {
            background: #000;
            border: 2px inset #808080;
            color: #FF00FF; /* Pink from your BG */
            padding: 2px 15px;
            font-family: monospace;
            margin-left: auto;
            margin-right: 20px;
        }

        #load-more-container {
            text-align: center;
            margin: 50px 0;
        }

        .btn-90s {
            background: #FFFF00; /* Yellow */
            border: 6px outset #FFFF00;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-90s:active {
            border: 6px inset #FFFF00;
        }
    </style>
</head>
<body>

<center>
    <div style="background: black; color: white; padding: 10px; display: inline-block; margin-top: 20px; border: 3px double white;">
        <h1><blink>THE SHITPOST SMITHSONIAN</blink></h1>
    </div>
</center>

<div id="main-scroll-zone">
    <div id="meme-container"></div>
    
    <div id="load-more-container">
        <button class="btn-90s" onclick="digDeeper()">[ DIG DEEPER ]</button>
    </div>
</div>

<div id="taskbar">
    <div id="home-button" onclick="location.href='index.html'">HOME</div>
    <div style="font-size: 11px; color: #555;">MEMPHIS_OS v1.0</div>
    <div id="counter-display">MEMES_FOUND: 0</div>
</div>

<script>
    let memeCount = 0;
    
    // Placeholder 90s test images (Replace with your own later)
    const testPool = [
        "https://web.archive.org/web/20090829143527im_/http://geocities.com/Heartland/Plains/1385/undercon.gif",
        "https://web.archive.org/web/20091027005128im_/http://geocities.com/athens/aegean/2559/spinningstar.gif",
        "https://web.archive.org/web/20090829143527im_/http://geocities.com/Heartland/Plains/1385/new.gif"
    ];

    function digDeeper() {
        const container = document.getElementById('meme-container');
        
        for (let i = 0; i < 4; i++) {
            memeCount++;
            const frame = document.createElement('div');
            frame.className = 'meme-frame';
            
            // Randomized values for the "Chaotic" look
            const randWidth = Math.floor(Math.random() * 200) + 150;
            const randLeft = Math.floor(Math.random() * 65);
            const randRot = Math.floor(Math.random() * 20) - 10;
            const randImg = testPool[Math.floor(Math.random() * testPool.length)];

            frame.style.width = randWidth + 'px';
            frame.style.marginLeft = randLeft + '%';
            frame.style.transform = `rotate(${randRot}deg)`;
            frame.style.marginBottom = "60px";
            frame.style.display = "block";

            frame.innerHTML = `
                <img src="${randImg}" width="100%">
                <div class="caption">DATA_PHASE_${memeCount}.BMP</div>
            `;
            
            container.appendChild(frame);
        }
        
        document.getElementById('counter-display').innerText = `MEMES_FOUND: ${memeCount}`;
        window.scrollBy({ top: 400, behavior: 'smooth' });
    }

    // Initial load
    window.onload = digDeeper;
</script>

</body>
</html>
