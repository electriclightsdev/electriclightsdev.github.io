<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM DIAGNOSTIC // POWER STATUS</title>
  <link rel="icon" type="image/png" href="assets/icon2.gif">
  <style>
    body {
      background-color: #000080; /* Classic Win95 Blue */
      color: #fff;
      font-family: "Courier New", Courier, monospace;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    .win-box {
      background: #c0c0c0;
      color: #000;
      border-top: 2px solid #fff;
      border-left: 2px solid #fff;
      border-right: 2px solid #000;
      border-bottom: 2px solid #000;
      padding: 20px;
      box-shadow: inset -1px -1px #808080, inset 1px 1px #dfdfdf, 5px 5px 15px rgba(0,0,0,0.5);
      max-width: 400px;
    }

    h1 {
      font-size: 1.2rem;
      margin-top: 0;
      border-bottom: 2px groove #ccc;
      padding-bottom: 10px;
    }

    button {
      background: #c0c0c0;
      border-top: 2px solid #fff;
      border-left: 2px solid #fff;
      border-right: 2px solid #000;
      border-bottom: 2px solid #000;
      padding: 10px 20px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    button:active {
      border-top: 2px solid #000;
      border-left: 2px solid #000;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
    }

    /* The "YES" state */
    #result-screen {
      background: #000;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .giant-yes {
      font-size: 15vw;
      color: #00ff00;
      font-weight: bold;
      text-shadow: 0 0 20px #00ff00;
      animation: hyper-blink 0.05s infinite;
      margin: 0;
    }

    @keyframes hyper-blink {
      0% { color: #00ff00; transform: translate(2px, -2px); }
      50% { color: #fff; transform: translate(-2px, 2px); }
      100% { color: #00ff00; transform: translate(0, 0); }
    }

    .return-link {
      margin-top: 50px;
      color: #fff;
      font-size: 1rem;
      text-decoration: none;
      border: 1px dashed #fff;
      padding: 5px 10px;
    }

    .return-link:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>

  <div id="step-1" class="win-box">
    <h1>HARDWARE DIAGNOSTIC UTILITY</h1>
    <p>Please click the button below to run a deep-level scan to determine if your computer is currently turned on.</p>
    <button onclick="runDiagnostic()">CHECK POWER STATUS</button>
  </div>

  <div id="result-screen" class="hidden">
    <div class="giant-yes">YES.</div>
    <a href="index.html" class="return-link">◀ RETURN TO CAVE</a>
  </div>

  <script>
    function runDiagnostic() {
      // Hide the prompt, show the answer
      document.getElementById('step-1').classList.add('hidden');
      
      const resultScreen = document.getElementById('result-screen');
      resultScreen.classList.remove('hidden');
      
      // Make the background flash rapidly for maximum 90s headache induction
      setInterval(() => {
        document.body.style.backgroundColor = document.body.style.backgroundColor === 'rgb(0, 0, 0)' ? '#ff0000' : '#000000';
      }, 50);
    }
  </script>

</body>
</html>
