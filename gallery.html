    /* =========================================
       1. WIN95 DESKTOP BACKGROUND
       ========================================= */
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: "Arial", sans-serif;
      background-color: #008080; 
      cursor: url('assets/mouse.png'), auto; 
    }

    a {
      cursor: url('assets/mouse.png'), pointer; 
    }

    /* =========================================
       2. WIN95 GALLERY BOX
       ========================================= */
    .win95-window {
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset -1px -1px #808080, inset 1px 1px #dfdfdf;
      width: 95%;
      max-width: 1400px; 
      margin: 0 auto;
      padding: 2px;
    }

    .win95-titlebar {
      background: linear-gradient(to right, #000080, #1084d0);
      padding: 3px 3px 3px 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .win95-controls {
      display: flex;
      gap: 2px;
    }

    .win95-btn {
      background-color: #c0c0c0;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #000000;
      border-bottom: 1px solid #000000;
      box-shadow: inset -1px -1px #808080;
      font-size: 11px;
      font-weight: bold;
      padding: 1px 5px;
      cursor: inherit; 
      color: black;
      min-width: 20px;
    }

    .win95-btn:active {
      border-top: 1px solid #000000;
      border-left: 1px solid #000000;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      box-shadow: inset 1px 1px #808080;
      padding: 2px 4px 0px 6px; 
    }

    /* =========================================
       3. THE INNER GALLERY & LAYOUT
       ========================================= */
    .win95-content {
      padding: 10px;
      background-color: #c0c0c0;
    }

    /* Animation to make the 4k background pan up and down */
    @keyframes pan-background {
      0% { background-position: center 0%; }
      50% { background-position: center 100%; }
      100% { background-position: center 0%; }
    }

    .gallery-grid {
      background-color: #000000;
      background-image: url('assets/bg/VvNhMb0.jpg');
      /* Removed background-size: cover so it stays at its native, un-stretched resolution */
      background-repeat: repeat; 
      animation: pan-background 60s linear infinite; /* Smooth 60-second panning loop */
      
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 15px;
      
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      
      height: 82vh; 
      overflow-y: auto; 
    }

    .gallery-grid img {
      max-width: 100%; 
      /* Removed the grey transparent background color and the border */
      image-rendering: pixelated;
      transition: transform 0.1s;
      cursor: url('assets/magnify.png'), zoom-in; 
    }

    .gallery-grid img:hover {
      transform: scale(1.05);
      /* Kept the neon glow to help them pop against the moving background */
      box-shadow: 0px 0px 15px #00ffff; 
    }

    .gallery-grid::-webkit-scrollbar { width: 16px; }
    .gallery-grid::-webkit-scrollbar-track { background: #dfdfdf; border-left: 1px solid #808080; }
    .gallery-grid::-webkit-scrollbar-thumb { background-color: #c0c0c0; border: 1px solid #ffffff; box-shadow: inset -1px -1px #000, inset 1px 1px #fff; }

    /* =========================================
       4. POP-UP IMAGE VIEWER (MODAL)
       ========================================= */
    .modal-overlay {
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    .modal-window {
      width: auto;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-content-inner {
      padding: 15px;
      background-color: #c0c0c0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content-inner img {
      max-width: 100%;
      max-height: 75vh;
      border: 2px inset #808080;
      image-rendering: pixelated;
    }
  </style>
