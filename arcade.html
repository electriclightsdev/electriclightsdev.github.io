<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
    /* ============================================================
       TOKENS
    ============================================================ */
    :root {
      /* Room palette — dim 90s mall arcade */
      --floor-base:   #1a0a2e;    /* deep purple carpet */
      --floor-accent1:#d63384;    /* magenta carpet accent */
      --floor-accent2:#00d4d4;    /* cyan carpet accent */
      --wall-base:    #2a1f3d;    /* dingy plum wall */
      --wall-shadow:  #15102a;
      --ceiling:      #1d1a2e;    /* dark ceiling */
      --ceiling-tile: #3a3346;    /* drop-tile lines */
      --trim:         #8a6a3a;    /* tan wall trim */

      /* Cabinet glows */
      --glow-cyan:    #00e5e5;    /* stand-up */
      --glow-amber:   #ffb040;    /* skeeball lanes */
      --glow-yellow:  #ffdd44;    /* claw prize lights */
      --glow-green:   #40ff80;    /* racing dashboard */
      --glow-magenta: #ff3ea5;    /* second stand-up */
      --glow-red:     #ff4060;    /* pinball warn */
      --glow-dim:     #4a4050;    /* dead / out-of-order */

      /* Neon sign */
      --neon-cyan:    #00e5e5;
      --neon-magenta: #ff3ea5;

      --font-heading: 'Press Start 2P', cursive;
      --font-body:    'VT323', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: var(--font-body);
      color: #fff;
    }

    /* ============================================================
       ROOM STAGE
    ============================================================ */
    .room {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: 18% 14% 1fr 6%;
      grid-template-areas:
        "ceiling"
        "sign"
        "cabinets"
        "floor";
      background: var(--wall-base);
      transition: opacity 0.4s ease;
    }
    .room.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* --- Ceiling: drop-tile grid --- */
    .ceiling {
      grid-area: ceiling;
      background:
        linear-gradient(180deg, var(--ceiling) 0%, var(--wall-shadow) 100%),
        var(--ceiling);
      border-bottom: 2px solid #000;
      position: relative;
      overflow: hidden;
    }
    .ceiling::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, var(--ceiling-tile) 1px, transparent 1px),
        linear-gradient(0deg,  var(--ceiling-tile) 1px, transparent 1px);
      background-size: 80px 40px;
      opacity: 0.5;
    }
    /* One flickering ceiling light */
    .ceiling-light {
      position: absolute;
      top: 12%;
      left: 22%;
      width: 90px;
      height: 12px;
      background: #fff8d0;
      border-radius: 2px;
      box-shadow: 0 8px 30px 8px rgba(255, 248, 200, 0.25);
      animation: flicker 6.2s infinite;
    }
    .ceiling-light-2 {
      left: auto;
      right: 18%;
      top: 45%;
      opacity: 0.55;
      animation-delay: 2.1s;
      animation-duration: 9s;
    }
    @keyframes flicker {
      0%, 44%, 46%, 49%, 51%, 100% { opacity: 1; }
      45%, 50% { opacity: 0.15; }
      47%, 48% { opacity: 0.6; }
    }

    /* --- Neon sign band --- */
    .sign-band {
      grid-area: sign;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background:
        radial-gradient(ellipse at center, rgba(255, 62, 165, 0.12) 0%, transparent 65%),
        linear-gradient(180deg, var(--wall-shadow) 0%, var(--wall-base) 100%);
      border-bottom: 3px solid var(--wall-shadow);
    }
    .neon-sign {
      font-family: var(--font-heading);
      font-size: clamp(1.8rem, 5.5vw, 4.5rem);
      letter-spacing: 0.35em;
      color: var(--neon-cyan);
      text-shadow:
        0 0 4px #fff,
        0 0 10px var(--neon-cyan),
        0 0 22px var(--neon-cyan),
        0 0 40px var(--neon-cyan);
      padding: 0 0 0 0.35em;  /* compensate for letter-spacing on last char */
    }
    .neon-sign .flick-s {
      display: inline-block;
      animation: neon-flicker-s 4.7s infinite;
    }
    @keyframes neon-flicker-s {
      0%, 20%, 100% { opacity: 1; text-shadow: 0 0 4px #fff, 0 0 10px var(--neon-cyan), 0 0 22px var(--neon-cyan), 0 0 40px var(--neon-cyan); }
      21%, 24% { opacity: 0.25; text-shadow: none; }
      25%, 29% { opacity: 1; }
      30%, 32% { opacity: 0.4; text-shadow: 0 0 4px var(--neon-cyan); }
      33% { opacity: 1; }
    }
    .sign-stars {
      position: absolute;
      font-family: var(--font-heading);
      font-size: clamp(0.6rem, 1.4vw, 1rem);
      color: var(--neon-magenta);
      text-shadow: 0 0 8px var(--neon-magenta), 0 0 16px var(--neon-magenta);
      opacity: 0.75;
    }
    .sign-stars.left  { left: 6%; }
    .sign-stars.right { right: 6%; }

    /* --- Back wall posters --- */
    .posters {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0;
      pointer-events: none;
    }

    /* --- Cabinet strip --- */
    .cabinets {
      grid-area: cabinets;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 0 2vw 0 2vw;
      gap: 1vw;
      position: relative;
      background:
        linear-gradient(180deg, var(--wall-base) 0%, var(--wall-base) 85%, rgba(0,0,0,0.35) 100%);
      overflow-x: auto;
      overflow-y: clip;
      overflow-clip-margin: 34px;   /* keep .cab-label (bottom: -22px) visible */
      scroll-behavior: smooth;

      /* Firefox */
      scrollbar-width: thin;
      scrollbar-color: var(--neon-cyan) #0a0510;
    }

    /* Stylized horizontal scrollbar — chunky pixel-arcade vibe */
    .cabinets::-webkit-scrollbar {
      height: 14px;
      background: #0a0510;
    }
    .cabinets::-webkit-scrollbar-track {
      background:
        repeating-linear-gradient(
          90deg,
          #0a0510 0px, #0a0510 6px,
          #15102a 6px, #15102a 7px
        );
      border-top: 2px solid var(--wall-shadow);
      border-bottom: 2px solid #000;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9);
    }
    .cabinets::-webkit-scrollbar-thumb {
      background:
        linear-gradient(180deg,
          #50ffff 0%,
          var(--neon-cyan) 35%,
          #007a7a 70%,
          #004040 100%);
      border: 2px solid #000;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        inset 2px 0 0 rgba(255, 255, 255, 0.15),
        inset -2px 0 0 rgba(0, 0, 0, 0.4),
        0 0 10px rgba(0, 229, 229, 0.55);
    }
    .cabinets::-webkit-scrollbar-thumb:hover {
      background:
        linear-gradient(180deg,
          #90ffff 0%,
          #40ffff 35%,
          var(--neon-cyan) 70%,
          #006060 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        0 0 16px rgba(0, 229, 229, 0.9);
    }
    .cabinets::-webkit-scrollbar-thumb:active {
      background:
        linear-gradient(180deg,
          #ff8fc8 0%,
          var(--neon-magenta) 40%,
          #a01060 80%,
          #500830 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        0 0 16px rgba(255, 62, 165, 0.9);
    }
    .cabinets::-webkit-scrollbar-button { display: none; }
    .cabinets::-webkit-scrollbar-corner { background: #0a0510; }

    /* Faint wall posters on back wall behind cabinets */
    .cabinets::before,
    .cabinets::after {
      content: "";
      position: absolute;
      width: 60px;
      height: 80px;
      background: #5a3a50;
      border: 2px solid #2a1f3d;
      top: 8%;
      opacity: 0.45;
      transform: rotate(-3deg);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
    }
    .cabinets::before { left: 8%; }
    .cabinets::after  { right: 10%; transform: rotate(2deg); background: #4a3a60; }

    /* Each cabinet is an anchored flex item */
    .cabinet {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.18s ease, filter 0.18s ease;
      user-select: none;
    }
    .cabinet:hover {
      transform: translateY(-4px);
      filter: brightness(1.15);
    }
    .cabinet.flavor {
      cursor: default;
    }
    .cabinet.flavor:hover {
      transform: none;
      filter: none;
    }
    .cabinet svg {
      display: block;
      height: auto;
      max-height: 100%;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.65));
    }

    /* Cabinet labels under each machine */
    .cab-label {
      position: absolute;
      bottom: -22px;
      font-family: var(--font-heading);
      font-size: clamp(0.35rem, 0.75vw, 0.5rem);
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.35);
      white-space: nowrap;
      text-transform: uppercase;
      pointer-events: none;
    }
    .cabinet:hover .cab-label {
      color: rgba(255, 255, 255, 0.85);
    }
    .cabinet.flavor:hover .cab-label {
      color: rgba(255, 255, 255, 0.35);
    }

    /* Size the cabinets (viewport-relative so they scale together) */
    .cab-standup   { width: clamp(120px, 14vw, 220px); }
    .cab-standup-2 { width: clamp(120px, 14vw, 220px); }
    .cab-racing    { width: clamp(150px, 18vw, 290px); }
    .cab-claw      { width: clamp(120px, 14vw, 220px); }
    .cab-pinball   { width: clamp(140px, 16vw, 260px); }
    .cab-ooo       { width: clamp(100px, 12vw, 190px); }
    .cab-pc        { width: clamp(180px, 21vw, 340px); }
    .cab-fighter   { width: clamp(150px, 17vw, 280px); }
    .cab-photo     { width: clamp(100px, 12vw, 190px); }

    /* Glow halos behind each cabinet */
    .glow {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 110%;
      height: 60%;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.35;
      pointer-events: none;
      z-index: -1;
    }
    .glow-cyan    { background: var(--glow-cyan);    }
    .glow-amber   { background: var(--glow-amber);   }
    .glow-yellow  { background: var(--glow-yellow);  }
    .glow-green   { background: var(--glow-green);   }
    .glow-magenta { background: var(--glow-magenta); }
    .glow-red     { background: var(--glow-red);    opacity: 0.25; }
    .glow-dim     { background: var(--glow-dim);    opacity: 0.15; }

    /* ============================================================
       FLOOR — geometric 90s carpet
    ============================================================ */
    .floor {
      grid-area: floor;
      background-color: var(--floor-base);
      background-image:
        /* Triangular zigzag pattern */
        linear-gradient(115deg, transparent 48%, var(--floor-accent1) 49%, var(--floor-accent1) 51%, transparent 52%),
        linear-gradient(65deg,  transparent 48%, var(--floor-accent2) 49%, var(--floor-accent2) 51%, transparent 52%),
        /* Dot pattern */
        radial-gradient(circle, var(--floor-accent2) 1px, transparent 2px),
        /* Base gradient to suggest floor perspective */
        linear-gradient(180deg, #2a1050 0%, var(--floor-base) 30%, #0a0520 100%);
      background-size: 56px 56px, 56px 56px, 28px 28px, 100% 100%;
      background-position: 0 0, 0 0, 14px 14px, 0 0;
      position: relative;
      border-top: 2px solid var(--wall-shadow);
      box-shadow: inset 0 20px 40px rgba(0,0,0,0.6);
    }

    /* Floor vignette — simulates distance */
    .floor::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
    }

    /* ============================================================
       EXIT DOOR sign (right side)
    ============================================================ */
    .exit-sign {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 10;
      padding: 6px 14px;
      background: #8a0a18;
      color: #fff;
      font-family: var(--font-heading);
      font-size: 0.65rem;
      letter-spacing: 3px;
      border: 2px solid #2a0408;
      box-shadow: 0 0 12px rgba(255, 60, 80, 0.6);
      text-decoration: none;
      cursor: pointer;
    }
    .exit-sign:hover {
      background: #b00c20;
    }

    /* ============================================================
       VIEW MANAGEMENT — two top-level stages
    ============================================================ */
    .stage {
      position: fixed;
      inset: 0;
      transition: opacity 0.4s ease;
      opacity: 1;
    }
    .stage.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ============================================================
       INSERT COIN — page entry
    ============================================================ */
    #insert-coin {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      gap: 28px;
      user-select: none;
      transition: opacity 0.5s ease;
    }
    #insert-coin.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .ic-alien {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 0 14px var(--glow-cyan));
      animation: ic-pulse 2.2s ease-in-out infinite;
    }
    @keyframes ic-pulse {
      0%, 100% { filter: drop-shadow(0 0 10px var(--glow-cyan)); transform: scale(1); }
      50%      { filter: drop-shadow(0 0 28px var(--glow-cyan)); transform: scale(1.06); }
    }
    .ic-title {
      font-family: var(--font-heading);
      color: #fff;
      font-size: clamp(0.6rem, 1.6vw, 0.9rem);
      letter-spacing: 4px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
      opacity: 0.55;
    }
    .ic-prompt {
      font-family: var(--font-heading);
      color: var(--glow-cyan);
      font-size: clamp(0.5rem, 1.3vw, 0.75rem);
      letter-spacing: 3px;
      text-shadow: 0 0 12px var(--glow-cyan);
      animation: ic-blink 1.1s step-end infinite;
    }
    .ic-sub {
      font-family: var(--font-body);
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    @keyframes ic-blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    /* ============================================================
       CABINET VIEW — the big stand-up you zoom into
    ============================================================ */
    #cabinet-stage {
      background:
        radial-gradient(ellipse at center, #1c1528 0%, #0a0612 70%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .giant-arcade {
      width: 90vw;
      max-width: 820px;
      height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 0 40px rgba(0, 0, 0, 0.9));
    }

    /* --- Marquees --- */
    .marquee {
      width: 80%;
      height: 10%;
      background-color: #f0f0f0;
      border: 7px solid #222;
      display: flex;
      align-items: stretch;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }
    .marquee.bottom { height: 8%; }
    .stripe { flex: 0 0 8%; height: 100%; }
    .s-light  { background-color: #b8d4c8; }
    .s-med    { background-color: #6bb0aa; }
    .s-bright { background-color: #00c5c5; }
    .marquee-title {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      color: #111;
      font-size: clamp(0.35rem, 1.1vw, 0.65rem);
      letter-spacing: 4px;
    }

    /* --- Chassis + screen --- */
    .chassis {
      width: 85%;
      height: 55%;
      background-color: #4a5c66;
      border-left: 7px solid #222;
      border-right: 7px solid #222;
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }
    .side-panel {
      width: 5%;
      height: 100%;
      background-color: #f0f0f0;
      border-right: 4px solid #222;
      border-left: 4px solid #222;
    }
    .screen-bezel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3.5%;
    }
    .screen {
      width: 100%;
      height: 100%;
      aspect-ratio: 4 / 5;
      max-height: 100%;
      background-color: #060809;
      border: 10px solid #0a0a0a;
      border-radius: 36px;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 0 70px rgba(0,0,0,0.95),
        inset 0 0 20px rgba(0, 197, 197, 0.04),
        0 0 25px rgba(0, 197, 197, 0.08);
    }
    .screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 25%, rgba(255,255,255,0.04) 0%, transparent 60%);
      border-radius: 26px;
      pointer-events: none;
      z-index: 200;
    }
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.13) 3px, rgba(0,0,0,0.13) 6px
      );
      pointer-events: none;
      z-index: 150;
      border-radius: 26px;
    }

    /* --- Boot overlay --- */
    #boot-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 90;
      border-radius: 26px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #boot-overlay.resolving { animation: bootFade 0.85s ease forwards; }
    @keyframes bootFade { 0% { opacity: 1; } 100% { opacity: 0; } }
    #boot-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 0;
      background: #fff;
      box-shadow: 0 0 12px #fff, 0 0 30px rgba(255,255,255,0.7);
      transform: translateY(-50%);
      z-index: 2;
    }
    #boot-line.active { animation: lineFlash 0.45s ease forwards; }
    @keyframes lineFlash {
      0%   { height: 0;   opacity: 1; }
      25%  { height: 4px; opacity: 1; }
      60%  { height: 2px; opacity: 1; }
      100% { height: 1px; opacity: 0; }
    }
    #boot-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
      transition: opacity 0.7s ease;
    }

    /* --- Game iframe --- */
    #view-game {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }
    #game-iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #000;
      display: block;
    }
    .game-bar {
      width: 100%;
      height: 30px;
      background: #080a0c;
      border-top: 1px solid #1e2428;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }
    .game-bar-title {
      font-family: var(--font-body);
      color: #6bb0aa;
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      letter-spacing: 2px;
    }
    .back-btn {
      font-family: var(--font-body);
      font-size: clamp(0.7rem, 1.4vw, 0.9rem);
      color: #00c5c5;
      background: transparent;
      border: 1px solid #2a4444;
      padding: 2px 10px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.15s ease;
    }
    .back-btn:hover {
      background: #00c5c5;
      color: #000;
      border-color: #00c5c5;
    }

    /* --- Loading screen --- */
    #view-loading {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #060809;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #view-loading.active {
      opacity: 1;
      pointer-events: auto;
    }
    .loading-game-name {
      font-family: var(--font-heading);
      color: #fff;
      font-size: clamp(0.5rem, 1.2vw, 0.75rem);
      letter-spacing: 3px;
      text-shadow: 0 0 8px #fff;
    }
    .loading-bar-wrap {
      width: 180px;
      height: 6px;
      background: #111;
      border: 1px solid #333;
      overflow: hidden;
    }
    .loading-bar {
      height: 100%;
      background: #00c5c5;
      box-shadow: 0 0 8px #00c5c5;
      animation: barSweep 1.4s ease-in-out infinite;
    }
    @keyframes barSweep {
      0%   { width: 0%;  margin-left: 0;   }
      50%  { width: 55%; margin-left: 22%; }
      100% { width: 0%;  margin-left: 100%; }
    }
    .loading-text {
      font-family: var(--font-body);
      color: #00c5c5;
      font-size: clamp(0.9rem, 2vw, 1.3rem);
      letter-spacing: 4px;
      text-shadow: 0 0 6px #00c5c5;
      animation: ic-blink 0.9s step-end infinite;
    }

    /* --- Control deck --- */
    .control-deck {
      width: 95%;
      height: 15%;
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .deck-surface {
      width: 100%;
      height: 80%;
      background: linear-gradient(180deg, #4a5c66 0%, #3a4a52 100%);
      border: 7px solid #222;
      clip-path: polygon(4% 0, 96% 0, 100% 100%, 0% 100%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 2%;
    }
    .deck-lip {
      width: 100%;
      height: 20%;
      background-color: #263038;
      border: 7px solid #222;
      border-top: none;
    }
    .nav-buttons {
      display: flex;
      gap: clamp(24px, 5vw, 56px);
      align-items: flex-end;
    }
    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .btn-label {
      font-family: var(--font-body);
      font-size: clamp(0.55rem, 1.1vw, 0.7rem);
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1px;
      text-transform: uppercase;
      user-select: none;
    }
    .deck-btn {
      width: 30px;
      height: 15px;
      border-radius: 50%;
      background-color: #3a4a52;
      border: 3px solid #0e0e0e;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.9), 0 0 9px #6bb0aa;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      position: relative;
    }
    .deck-btn::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px; right: 2px; bottom: 2px;
      background: #00c5c5;
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(0, 197, 197, 0.6);
    }
    .deck-btn:hover {
      box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.6), 0 0 18px #00c5c5;
      transform: scale(1.12);
    }
    .deck-btn:active {
      transform: scale(0.86);
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 1);
    }
    .btn-mute::after  { background: #e09a30; box-shadow: 0 0 4px rgba(224,154,48,0.6); }
    .btn-mute         { box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.9), 0 0 9px #c07820; }
    .btn-mute:hover   { box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.6), 0 0 18px #e09a30; }
    .btn-mute.is-muted { opacity: 0.45; }
    .btn-power::after { background: #e8e8e8; box-shadow: 0 0 4px rgba(255, 255, 255, 0.5); }
    .btn-power        { box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.9), 0 0 9px rgba(200, 200, 200, 0.5); }
    .btn-power:hover  { box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.6), 0 0 18px #fff; }


    @media (max-width: 800px) {
      .room {
        grid-template-rows: 10% 12% 1fr 28%;
      }
      .cabinets {
        gap: 0.5vw;
        padding: 0 1vw;
      }
      .cab-label {
        font-size: 0.32rem;
      }
    }
    </style>

                            </div>
                        </div>

                    </div><!-- /.screen -->
                </div><!-- /.screen-bezel -->

                <div class="side-panel"></div>
            </div><!-- /.chassis -->

            <!-- CONTROL DECK -->
            <div class="control-deck">
                <div class="deck-surface">
                    <div class="nav-buttons">
                        <div class="btn-wrap">
                            <button class="deck-btn btn-power" onclick="powerOff()"></button>
                            <span class="btn-label">Power</span>
                        </div>
                        <div class="btn-wrap">
                            <button class="deck-btn btn-mute" id="btn-mute" onclick="toggleMute()"></button>
                            <span class="btn-label">Mute</span>
                        </div>
                        <div class="btn-wrap">
                            <button class="deck-btn" onclick="exitToRoom()"></button>
                            <span class="btn-label">Home</span>
                        </div>
                    </div>
                </div>
                <div class="deck-lip"></div>
            </div>

            <!-- BOTTOM MARQUEE -->
            <div class="marquee bottom">
                <div class="stripe s-bright"></div>
                <div class="stripe s-med"></div>
                <div class="stripe s-light"></div>
                <div class="marquee-title"></div>
                <div class="stripe s-light"></div>
                <div class="stripe s-med"></div>
                <div class="stripe s-bright"></div>
            </div>

        </div><!-- /.giant-arcade -->
    </div><!-- /#cabinet-stage -->

    <!-- ================================================================
         JAVASCRIPT
    ================================================================ -->
    <script>
    /* ================================================================
       GAME LIBRARY
    ================================================================ */
    const GAMES = {
      brickbreak: { title: 'Brick Break', path: 'games/BRICKBREAK/BRICKBREAK.html' },
      snake:      { title: 'Snake',       path: 'games/SNAKE.html'           },
      roadkill:   { title: 'Roadkill',    path: 'games/ROADKILL.html'     },
      sokoban:    { title: 'Sokoban',     path: 'games/SOKOBAN.html'       },
    };

    /* ================================================================
       WEB AUDIO — boot sound, ambient hum, button clack, mute
    ================================================================ */
    let audioCtx   = null;
    let masterGain = null;
    let humGain    = null;
    let humOscs    = [];
    let isMuted    = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = isMuted ? 0 : 1;
      masterGain.connect(audioCtx.destination);
    }

    function resume() {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    /* --- Button clack --- */
    function playClack(forceAudible) {
      if (!audioCtx || (isMuted && !forceAudible)) return;
      resume();
      const ctx = audioCtx, now = ctx.currentTime;
      const o = ctx.createOscillator();
      o.type = 'square';
      o.frequency.value = 160;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.1);
    }

    /* --- Ambient hum (60hz-ish drone) --- */
    function startHum() {
      if (!audioCtx || humGain) return;
      resume();
      const ctx = audioCtx;
      humGain = ctx.createGain();
      humGain.gain.value = 0;
      humGain.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 1.4);
      humGain.connect(masterGain);
      [60, 120, 180].forEach((f, i) => {
        const o = ctx.createOscillator();
        o.type = i === 0 ? 'sawtooth' : 'sine';
        o.frequency.value = f;
        const g = ctx.createGain();
        g.gain.value = 0.65 / (i + 1);
        o.connect(g); g.connect(humGain);
        o.start();
        humOscs.push(o);
      });
    }

    function stopHum() {
      if (!humGain) return;
      const now = audioCtx.currentTime;
      humGain.gain.linearRampToValueAtTime(0, now + 0.6);
      humOscs.forEach(o => { try { o.stop(now + 0.7); } catch (e) {} });
      humOscs = [];
      humGain = null;
    }

    /* --- Boot power-on sound --- */
    function playBootSound() {
      resume();
      const ctx = audioCtx, now = ctx.currentTime;

      // Electrical surge
      const surge = ctx.createOscillator();
      surge.type = 'sawtooth';
      surge.frequency.setValueAtTime(28, now);
      surge.frequency.linearRampToValueAtTime(95, now + 0.55);
      const sg = ctx.createGain();
      sg.gain.setValueAtTime(0, now);
      sg.gain.linearRampToValueAtTime(0.45, now + 0.1);
      sg.gain.linearRampToValueAtTime(0, now + 0.55);
      surge.connect(sg); sg.connect(masterGain);
      surge.start(now); surge.stop(now + 0.6);

      // CRT crack
      const crackN = Math.floor(ctx.sampleRate * 0.06);
      const crackBuf = ctx.createBuffer(1, crackN, ctx.sampleRate);
      const cd = crackBuf.getChannelData(0);
      for (let i = 0; i < crackN; i++) cd[i] = (Math.random() * 2 - 1) * (1 - i / crackN);
      const crack = ctx.createBufferSource();
      crack.buffer = crackBuf;
      const cg = ctx.createGain();
      cg.gain.value = 0.7;
      crack.connect(cg); cg.connect(masterGain);
      crack.start(now + 0.28);

      // Static rush
      const statN = Math.floor(ctx.sampleRate * 1.9);
      const statBuf = ctx.createBuffer(1, statN, ctx.sampleRate);
      const sd = statBuf.getChannelData(0);
      for (let i = 0; i < statN; i++) {
        const env = 1 - i / statN;
        sd[i] = (Math.random() * 2 - 1) * env * env;
      }
      const stat = ctx.createBufferSource();
      stat.buffer = statBuf;
      const stg = ctx.createGain();
      stg.gain.setValueAtTime(0, now + 0.32);
      stg.gain.linearRampToValueAtTime(0.55, now + 0.5);
      stg.gain.linearRampToValueAtTime(0, now + 2.2);
      stat.connect(stg); stg.connect(masterGain);
      stat.start(now + 0.32);

      // C major arpeggio on resolution
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const c = ctx.createOscillator();
        c.type = 'sine';
        c.frequency.value = freq;
        const cg2 = ctx.createGain();
        const t = now + 2.5 + i * 0.11;
        cg2.gain.setValueAtTime(0, t);
        cg2.gain.linearRampToValueAtTime(0.16, t + 0.04);
        cg2.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
        c.connect(cg2); cg2.connect(masterGain);
        c.start(t); c.stop(t + 0.6);
      });
    }

    /* ================================================================
       BOOT SEQUENCE
    ================================================================ */
    let staticRafId = null;
    let bootRunning = false;
    let pendingGame = null;

    function runBootSequence(gameId) {
      if (bootRunning) return;
      bootRunning = true;
      pendingGame = gameId;

      initAudio();
      playBootSound();
      startHum();

      const overlay = document.getElementById('boot-overlay');
      const line    = document.getElementById('boot-line');
      const canvas  = document.getElementById('boot-canvas');

      // Reset
      overlay.style.display   = 'flex';
      overlay.style.opacity   = '1';
      overlay.classList.remove('resolving');
      canvas.style.transition = 'none';
      canvas.style.opacity    = '0';
      line.style.opacity      = '1';
      line.classList.remove('active');

      // Phase 1 → 280ms: line flash
      setTimeout(() => { line.classList.add('active'); }, 280);

      // Phase 2 → 480ms: canvas static fills screen
      setTimeout(() => {
        line.style.transition = 'opacity 0.15s';
        line.style.opacity = '0';
        canvas.width  = canvas.offsetWidth  || 500;
        canvas.height = canvas.offsetHeight || 380;
        animateStatic(canvas);
      }, 480);

      // Phase 3 → 2150ms: fade static
      setTimeout(() => {
        stopStatic();
        canvas.style.transition = 'opacity 0.75s ease';
        canvas.style.opacity = '0';
      }, 2150);

      // Phase 4 → 2750ms: overlay fades, start loading the game
      setTimeout(() => {
        overlay.classList.add('resolving');
        startGameLoad(pendingGame);
      }, 2750);

      // Phase 5 → 3600ms: overlay gone
      setTimeout(() => {
        overlay.style.display = 'none';
        bootRunning = false;
      }, 3600);
    }

    function animateStatic(canvas) {
      const ctx2d = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      canvas.style.transition = 'none';
      canvas.style.opacity = '1';

      function frame() {
        const img = ctx2d.createImageData(w, h);
        const data = img.data;
        for (let i = 0; i < data.length; i += 4) {
          const bright = Math.random() > 0.42;
          const v = bright ? Math.floor(Math.random() * 255) : 0;
          data[i]     = v;
          data[i + 1] = v;
          data[i + 2] = Math.random() > 0.96 ? Math.min(255, v + 80) : v;
          data[i + 3] = 255;
        }
        if (Math.random() > 0.85) {
          const row  = Math.floor(Math.random() * h);
          const barH = Math.floor(Math.random() * 6) + 1;
          for (let r = row; r < Math.min(row + barH, h); r++) {
            for (let c = 0; c < w; c++) {
              const idx = (r * w + c) * 4;
              const bv  = Math.floor(Math.random() * 220);
              data[idx]     = bv;
              data[idx + 1] = bv;
              data[idx + 2] = bv;
              data[idx + 3] = 255;
            }
          }
        }
        ctx2d.putImageData(img, 0, 0);
        staticRafId = requestAnimationFrame(frame);
      }
      frame();
    }

    function stopStatic() {
      if (staticRafId !== null) {
        cancelAnimationFrame(staticRafId);
        staticRafId = null;
      }
    }

    /* ================================================================
       GAME LOAD / EXIT
    ================================================================ */
    function startGameLoad(gameId) {
      const game = GAMES[gameId];
      if (!game) return;

      // Show loading overlay
      const loading = document.getElementById('view-loading');
      loading.classList.add('active');
      document.getElementById('loading-game-name').textContent = game.title.toUpperCase();
      document.getElementById('game-bar-title').textContent = game.title.toUpperCase();

      // Delay slightly, then load iframe
      setTimeout(() => {
        const iframe = document.getElementById('game-iframe');
        const gameView = document.getElementById('view-game');

        iframe.onload = () => {
          setTimeout(() => {
            loading.classList.remove('active');
            gameView.style.display = 'flex';
            // Focus iframe so keyboard input goes to game
            try { iframe.contentWindow.focus(); } catch (e) {}
          }, 300);
        };
        iframe.src = game.path;

        // Fallback if onload never fires
        setTimeout(() => {
          if (loading.classList.contains('active')) {
            loading.classList.remove('active');
            gameView.style.display = 'flex';
            try { iframe.contentWindow.focus(); } catch (e) {}
          }
        }, 3000);
      }, 300);
    }

    function enterCabinet(gameId) {
      const room   = document.getElementById('room');
      const cab    = document.getElementById('cabinet-stage');

      room.classList.add('hidden');
      setTimeout(() => {
        cab.classList.remove('hidden');
        runBootSequence(gameId);
      }, 420);
    }

    function exitToRoom() {
      playClack();
      stopHum();
      stopStatic();

      const iframe  = document.getElementById('game-iframe');
      const gameView = document.getElementById('view-game');
      const loading  = document.getElementById('view-loading');
      const overlay  = document.getElementById('boot-overlay');
      const cab      = document.getElementById('cabinet-stage');
      const room     = document.getElementById('room');

      // Tear down the game state
      iframe.src = '';
      gameView.style.display = 'none';
      loading.classList.remove('active');
      overlay.style.display = 'flex';
      overlay.style.opacity = '1';
      overlay.classList.remove('resolving');
      bootRunning = false;

      // Fade cabinet → room
      cab.classList.add('hidden');
      setTimeout(() => {
        room.classList.remove('hidden');
      }, 420);
    }

    function powerOff() {
      playClack();
      // Same as exit for now — fade back to room
      exitToRoom();
    }

    function toggleMute() {
      if (!isMuted) playClack(true);
      isMuted = !isMuted;
      if (masterGain) {
        masterGain.gain.setTargetAtTime(isMuted ? 0 : 1, audioCtx.currentTime, 0.08);
      }
      document.getElementById('btn-mute').classList.toggle('is-muted', isMuted);
      if (!isMuted) playClack();
    }

    /* ================================================================
       CABINET STRIP — duplicate cabinets + wheel-to-horizontal scroll
    ================================================================ */
    const cabStrip = document.querySelector('.cabinets');

    // Clone existing cabinets so there's enough to scroll through. Runs
    // BEFORE the click handlers below so the clones pick them up.
    (function populateDuplicates() {
      const originals = Array.from(cabStrip.querySelectorAll('.cabinet'));
      // Indices into `originals` — mix of cabinet types for visual variety
      const dupPlan = [2, 3, 0, 4, 1, 2];
      dupPlan.forEach(i => {
        const src = originals[i];
        if (!src) return;
        cabStrip.appendChild(src.cloneNode(true));
      });
    })();

    // Translate vertical wheel scroll into horizontal scroll on the strip,
    // so a plain mouse wheel feels natural here. Trackpad lateral gestures
    // and shift+wheel pass through untouched.
    cabStrip.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      e.preventDefault();
      cabStrip.scrollLeft += e.deltaY;
    }, { passive: false });

    /* ================================================================
       ROOM CLICKS
    ================================================================ */
    document.querySelectorAll('.cabinet').forEach(el => {
      el.addEventListener('click', () => {
        const gameId = el.getAttribute('data-game');
        if (!gameId) return;  // flavor cabinets do nothing
        enterCabinet(gameId);
      });
    });

    /* ================================================================
       INSERT COIN — entry
    ================================================================ */
    document.getElementById('insert-coin').addEventListener('click', () => {
      const ic = document.getElementById('insert-coin');
      ic.classList.add('fade-out');

      // Initialize audio on first user interaction (required by browsers)
      initAudio();

      setTimeout(() => {
        ic.style.display = 'none';
      }, 520);
    });
    </script>

</body>
</html>
