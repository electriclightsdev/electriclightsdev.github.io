<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXX's Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           RESET & VARIABLES
        ============================================================ */
        :root {
            --bg-dark: #0e1114;
            --chassis-color: #4a5c66;
            --chassis-dark: #3a4a52;
            --marquee-white: #f0f0f0;
            --outline-color: #222;
            --stripe-1: #b8d4c8;
            --stripe-2: #6bb0aa;
            --stripe-3: #00c5c5;
            --screen-bg: #060809;
            --alien-blue: #aee2e6;
            --font-heading: 'Press Start 2P', cursive;
            --font-body: 'VT323', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ============================================================
           BODY
        ============================================================ */
        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle, #1c2228 1px, transparent 1px);
            background-size: 22px 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: default;
        }

        /* ============================================================
           INSERT COIN SCREEN
        ============================================================ */
        #insert-coin {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            gap: 32px;
            user-select: none;
        }

        #insert-coin.fade-out {
            animation: icFadeOut 0.5s ease forwards;
        }

        @keyframes icFadeOut {
            to { opacity: 0; pointer-events: none; }
        }

        .ic-alien {
            width: 72px;
            height: 72px;
            filter: drop-shadow(0 0 14px var(--alien-blue));
            animation: icPulse 2.2s ease-in-out infinite;
        }

        @keyframes icPulse {
            0%, 100% { filter: drop-shadow(0 0 10px var(--alien-blue)); transform: scale(1); }
            50%       { filter: drop-shadow(0 0 28px var(--alien-blue)); transform: scale(1.06); }
        }

        .ic-title {
            font-family: var(--font-heading);
            color: #fff;
            font-size: clamp(0.5rem, 1.4vw, 0.8rem);
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(255,255,255,0.6);
            opacity: 0.5;
        }

        .ic-prompt {
            font-family: var(--font-heading);
            color: var(--stripe-3);
            font-size: clamp(0.45rem, 1.2vw, 0.7rem);
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--stripe-3);
            animation: blink 1.1s step-end infinite;
        }

        .ic-sub {
            font-family: var(--font-body);
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: #444;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ============================================================
           ARCADE MACHINE SHELL
        ============================================================ */
        .giant-arcade {
            width: 90vw;
            max-width: 960px;
            height: 95vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.9));
        }

        /* ============================================================
           MARQUEES
        ============================================================ */
        .marquee {
            width: 80%;
            height: 10%;
            background-color: var(--marquee-white);
            border: 7px solid var(--outline-color);
            display: flex;
            align-items: stretch;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        .bottom-marquee { height: 8%; }

        .stripe { flex: 0 0 8%; height: 100%; }
        .s-light  { background-color: var(--stripe-1); }
        .s-med    { background-color: var(--stripe-2); }
        .s-bright { background-color: var(--stripe-3); }

        .marquee-title {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            color: #111;
            font-size: clamp(0.35rem, 1.1vw, 0.65rem);
            letter-spacing: 4px;
            text-shadow: none;
        }

        /* ============================================================
           CHASSIS
        ============================================================ */
        .chassis {
            width: 85%;
            height: 55%;
            background-color: var(--chassis-color);
            border-left: 7px solid var(--outline-color);
            border-right: 7px solid var(--outline-color);
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .side-panel {
            width: 5%;
            height: 100%;
            background-color: var(--marquee-white);
            border-right: 4px solid var(--outline-color);
            border-left: 4px solid var(--outline-color);
        }

        .screen-bezel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3.5%;
        }

        /* ============================================================
           CRT SCREEN
        ============================================================ */
        .screen {
            width: 100%;
            height: 100%;
            background-color: var(--screen-bg);
            border: 10px solid #0a0a0a;
            border-radius: 36px;
            position: relative;
            overflow: hidden;
            box-shadow:
                inset 0 0 70px rgba(0,0,0,0.95),
                inset 0 0 20px rgba(0,197,197,0.04),
                0 0 25px rgba(0,197,197,0.08);
        }

        /* CRT glass glare */
        .screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 25%, rgba(255,255,255,0.04) 0%, transparent 60%);
            border-radius: 26px;
            pointer-events: none;
            z-index: 200;
        }

        /* Scanlines */
        .scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(0,0,0,0.13) 3px,
                rgba(0,0,0,0.13) 6px
            );
            pointer-events: none;
            z-index: 150;
            border-radius: 26px;
        }

        /* ============================================================
           BOOT OVERLAY
        ============================================================ */
        #boot-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 90;
            border-radius: 26px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #boot-overlay.resolving {
            animation: bootFade 0.85s ease forwards;
        }

        @keyframes bootFade {
            0%   { opacity: 1; }
            100% { opacity: 0; }
        }

        #boot-line {
            position: absolute;
            left: 0; right: 0;
            top: 50%;
            height: 0;
            background: #fff;
            box-shadow: 0 0 12px #fff, 0 0 30px rgba(255,255,255,0.7);
            transform: translateY(-50%);
            z-index: 2;
            transition: none;
        }

        #boot-line.active {
            animation: lineFlash 0.45s ease forwards;
        }

        @keyframes lineFlash {
            0%   { height: 0;   opacity: 1; }
            25%  { height: 4px; opacity: 1; }
            60%  { height: 2px; opacity: 1; }
            100% { height: 1px; opacity: 0; }
        }

        #boot-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 1;
            transition: opacity 0.7s ease;
        }

        /* ============================================================
           SCREEN VIEWS (all stack absolutely)
        ============================================================ */
        .screen-view {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 10;
        }

        .screen-view.active-view {
            opacity: 1;
            pointer-events: auto;
        }

        /* ============================================================
           HOME VIEW
        ============================================================ */
        .alien-icon {
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px var(--alien-blue));
            animation: alienFloat 3.5s ease-in-out infinite;
        }

        @keyframes alienFloat {
            0%, 100% { transform: translateY(0);    filter: drop-shadow(0 0 10px var(--alien-blue)); }
            50%       { transform: translateY(-7px); filter: drop-shadow(0 0 22px var(--alien-blue)); }
        }

        .arcade-title {
            font-family: var(--font-heading);
            color: #fff;
            font-size: clamp(0.45rem, 1.6vw, 0.9rem);
            letter-spacing: 3px;
            text-shadow: 0 0 8px #fff, 0 0 20px rgba(255,255,255,0.4);
        }

        .press-start {
            font-family: var(--font-body);
            color: var(--stripe-3);
            font-size: clamp(0.9rem, 2.2vw, 1.5rem);
            margin-top: 22px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--stripe-3);
            animation: blink 1.2s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        /* ============================================================
           LIBRARY VIEW
        ============================================================ */
        #view-library { gap: 14px; padding: 16px; }

        .library-title {
            font-family: var(--font-heading);
            color: var(--stripe-3);
            font-size: clamp(0.35rem, 1vw, 0.6rem);
            letter-spacing: 3px;
            text-shadow: 0 0 8px var(--stripe-3);
        }

        .cart-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 460px;
        }

        .cartridge {
            background: linear-gradient(155deg, #1e2327, #14181c);
            border: 2px solid #333;
            border-bottom: 4px solid #0a0a0a;
            padding: 14px 10px 12px;
            cursor: pointer;
            transition: all 0.18s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
        }

        /* Scan-sweep on hover */
        .cartridge::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,197,197,0.07), transparent);
            transition: left 0.4s ease;
        }

        .cartridge:hover::after { left: 150%; }

        /* Top accent bar */
        .cartridge::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--stripe-3);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.22s ease;
        }

        .cartridge:hover::before  { transform: scaleX(1); }
        .cartridge:hover {
            border-color: var(--stripe-3);
            background: linear-gradient(155deg, #252c32, #1a2025);
            box-shadow: 0 0 18px rgba(0,197,197,0.18), 0 4px 12px rgba(0,0,0,0.5);
            transform: translateY(-3px);
        }

        .cartridge:active { transform: translateY(0) scale(0.96); }

        .cart-icon {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            line-height: 1;
        }

        .cart-name {
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 1.8vw, 1.1rem);
            color: #ddd;
            text-align: center;
            line-height: 1.2;
        }

        .cart-genre {
            font-family: var(--font-body);
            font-size: clamp(0.65rem, 1.3vw, 0.85rem);
            color: var(--stripe-2);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ============================================================
           LOADING VIEW
        ============================================================ */
        #view-loading { gap: 18px; }

        .loading-game-name {
            font-family: var(--font-heading);
            color: #fff;
            font-size: clamp(0.35rem, 1vw, 0.6rem);
            letter-spacing: 2px;
            text-shadow: 0 0 8px #fff;
        }

        .loading-bar-wrap {
            width: 180px;
            height: 6px;
            background: #111;
            border: 1px solid #333;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: var(--stripe-3);
            box-shadow: 0 0 8px var(--stripe-3);
            animation: barSweep 1.4s ease-in-out infinite;
        }

        @keyframes barSweep {
            0%   { width: 0%;  margin-left: 0; }
            50%  { width: 55%; margin-left: 22%; }
            100% { width: 0%;  margin-left: 100%; }
        }

        .loading-text {
            font-family: var(--font-body);
            color: var(--stripe-3);
            font-size: clamp(0.9rem, 2vw, 1.3rem);
            letter-spacing: 4px;
            text-shadow: 0 0 6px var(--stripe-3);
            animation: blink 0.9s step-end infinite;
        }

        /* ============================================================
           GAME VIEW
        ============================================================ */
        #view-game { padding: 0; }

        #game-iframe {
            width: 100%;
            height: calc(100% - 30px);
            border: none;
            background: #000;
            display: block;
        }

        .game-bar {
            width: 100%;
            height: 30px;
            background: #080a0c;
            border-top: 1px solid #1e2428;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            flex-shrink: 0;
        }

        .game-bar-title {
            font-family: var(--font-body);
            color: var(--stripe-2);
            font-size: clamp(0.75rem, 1.5vw, 1rem);
            letter-spacing: 2px;
        }

        .back-btn {
            font-family: var(--font-body);
            font-size: clamp(0.7rem, 1.4vw, 0.9rem);
            color: var(--stripe-3);
            background: transparent;
            border: 1px solid #2a4444;
            padding: 2px 10px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }

        .back-btn:hover {
            background: var(--stripe-3);
            color: #000;
            border-color: var(--stripe-3);
        }

        /* ============================================================
           CONTROL DECK
        ============================================================ */
        .control-deck {
            width: 95%;
            height: 15%;
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .deck-surface {
            width: 100%;
            height: 80%;
            background: linear-gradient(180deg, var(--chassis-color) 0%, var(--chassis-dark) 100%);
            border: 7px solid var(--outline-color);
            clip-path: polygon(4% 0, 96% 0, 100% 100%, 0% 100%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 2%;
        }

        .deck-lip {
            width: 100%;
            height: 20%;
            background-color: #263038;
            border: 7px solid var(--outline-color);
            border-top: none;
        }

        /* Buttons */
        .nav-buttons {
            display: flex;
            gap: clamp(20px, 4vw, 48px);
            align-items: flex-end;
        }

        .btn-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .btn-label {
            font-family: var(--font-body);
            font-size: clamp(0.5rem, 1.1vw, 0.65rem);
            color: rgba(255,255,255,0.35);
            letter-spacing: 1px;
            user-select: none;
            text-transform: uppercase;
        }

        .deck-btn {
            width: 30px;
            height: 15px;
            border-radius: 50%;
            background-color: var(--chassis-dark);
            border: 3px solid #0e0e0e;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.9), 0 0 9px var(--stripe-2);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            position: relative;
        }

        .deck-btn::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: var(--stripe-3);
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,197,197,0.6);
        }

        .deck-btn:hover {
            box-shadow: inset 0 0 3px rgba(0,0,0,0.6), 0 0 18px var(--stripe-3);
            transform: scale(1.12);
        }

        .deck-btn:active {
            transform: scale(0.86);
            box-shadow: inset 0 0 14px rgba(0,0,0,1);
        }

        /* Mute button — amber */
        .btn-mute::after { background: #e09a30; box-shadow: 0 0 4px rgba(224,154,48,0.6); }
        .btn-mute { box-shadow: inset 0 0 6px rgba(0,0,0,0.9), 0 0 9px #c07820; }
        .btn-mute:hover { box-shadow: inset 0 0 3px rgba(0,0,0,0.6), 0 0 18px #e09a30; }
        .btn-mute.is-muted { opacity: 0.45; }

        /* Power button — white */
        .btn-power::after { background: #e8e8e8; box-shadow: 0 0 4px rgba(255,255,255,0.5); }
        .btn-power { box-shadow: inset 0 0 6px rgba(0,0,0,0.9), 0 0 9px rgba(200,200,200,0.5); }
        .btn-power:hover { box-shadow: inset 0 0 3px rgba(0,0,0,0.6), 0 0 18px #fff; }
    </style>
</head>
<body>

    <!-- ================================================================
         INSERT COIN SCREEN
    ================================================================ -->
    <div id="insert-coin">
        <svg class="ic-alien" viewBox="0 0 100 100" fill="#aee2e6">
            <path d="M30,20 h10 v10 h-10 z M60,20 h10 v10 h-10 z M40,30 h20 v10 h-20 z M30,40 h40 v10 h-40 z M20,50 h60 v10 h-60 z M10,60 h80 v10 h-80 z M10,70 h20 v10 h-20 z M70,70 h20 v10 h-20 z M30,80 h10 v10 h-10 z M60,80 h10 v10 h-10 z"/>
        </svg>
        <div class="ic-title">XXX'S ARCADE</div>
        <div class="ic-prompt">▶ INSERT COIN ◀</div>
        <div class="ic-sub">click anywhere to start</div>
    </div>

    <!-- ================================================================
         ARCADE MACHINE
    ================================================================ -->
    <div class="giant-arcade">

        <!-- TOP MARQUEE -->
        <div class="marquee top-marquee">
            <div class="stripe s-bright"></div>
            <div class="stripe s-med"></div>
            <div class="stripe s-light"></div>
            <div class="marquee-title">✦ XXX'S ARCADE ✦</div>
            <div class="stripe s-light"></div>
            <div class="stripe s-med"></div>
            <div class="stripe s-bright"></div>
        </div>

        <!-- MAIN CHASSIS -->
        <div class="chassis">
            <div class="side-panel"></div>

            <div class="screen-bezel">
                <div class="screen">
                    <div class="scanlines"></div>

                    <!-- BOOT OVERLAY -->
                    <div id="boot-overlay">
                        <div id="boot-line"></div>
                        <canvas id="boot-canvas"></canvas>
                    </div>

                    <!-- HOME VIEW -->
                    <div id="view-home" class="screen-view">
                        <svg class="alien-icon" viewBox="0 0 100 100" fill="#aee2e6">
                            <path d="M30,20 h10 v10 h-10 z M60,20 h10 v10 h-10 z M40,30 h20 v10 h-20 z M30,40 h40 v10 h-40 z M20,50 h60 v10 h-60 z M10,60 h80 v10 h-80 z M10,70 h20 v10 h-20 z M70,70 h20 v10 h-20 z M30,80 h10 v10 h-10 z M60,80 h10 v10 h-10 z"/>
                        </svg>
                        <h2 class="arcade-title">XXX'S ARCADE</h2>
                        <p class="press-start">PRESS START</p>
                    </div>

                    <!-- LIBRARY VIEW -->
                    <div id="view-library" class="screen-view">
                        <h3 class="library-title">— SELECT CARTRIDGE —</h3>
                        <div class="cart-grid">
                            <div class="cartridge" onclick="loadGame('Brick Break')">
                                <span class="cart-icon">🎵</span>
                                <span class="cart-name">Brick Break</span>
                                <span class="cart-genre">game</span>
                            </div>
                            <div class="cartridge" onclick="loadGame('stat-blaster')">
                                <span class="cart-icon">📊</span>
                                <span class="cart-name">Stat Blaster</span>
                                <span class="cart-genre">Strategy</span>
                            </div>
                            <div class="cartridge" onclick="loadGame('spire-harvester')">
                                <span class="cart-icon">🌿</span>
                                <span class="cart-name">Spire Harvester</span>
                                <span class="cart-genre">Adventure</span>
                            </div>
                        </div>
                    </div>

                    <!-- LOADING VIEW -->
                    <div id="view-loading" class="screen-view">
                        <span class="loading-game-name" id="loading-game-name">LOADING</span>
                        <div class="loading-bar-wrap">
                            <div class="loading-bar"></div>
                        </div>
                        <span class="loading-text">LOADING...</span>
                    </div>

                    <!-- GAME VIEW -->
                    <div id="view-game" class="screen-view" style="padding:0;">
                        <iframe id="game-iframe" src="" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
                        <div class="game-bar">
                            <span class="game-bar-title" id="game-bar-title">GAME</span>
                            <button class="back-btn" onclick="exitGame()">◀ EXIT</button>
                        </div>
                    </div>

                </div><!-- .screen -->
            </div><!-- .screen-bezel -->

            <div class="side-panel"></div>
        </div><!-- .chassis -->

        <!-- CONTROL DECK -->
        <div class="control-deck">
            <div class="deck-surface">
                <div class="nav-buttons">
                    <div class="btn-wrap">
                        <button class="deck-btn" onclick="navBtn('view-home')"></button>
                        <span class="btn-label">Home</span>
                    </div>
                    <div class="btn-wrap">
                        <button class="deck-btn" onclick="navBtn('view-library')"></button>
                        <span class="btn-label">Games</span>
                    </div>
                    <div class="btn-wrap">
                        <button class="deck-btn" onclick="navBtn('github')"></button>
                        <span class="btn-label">GitHub</span>
                    </div>
                    <div class="btn-wrap">
                        <button class="deck-btn btn-mute" id="btn-mute" onclick="toggleMute()"></button>
                        <span class="btn-label">Mute</span>
                    </div>
                    <div class="btn-wrap">
                        <button class="deck-btn btn-power" onclick="reboot()"></button>
                        <span class="btn-label">Power</span>
                    </div>
                </div>
            </div>
            <div class="deck-lip"></div>
        </div>

        <!-- BOTTOM MARQUEE -->
        <div class="marquee bottom-marquee">
            <div class="stripe s-bright"></div>
            <div class="stripe s-med"></div>
            <div class="stripe s-light"></div>
            <div class="marquee-title"></div>
            <div class="stripe s-light"></div>
            <div class="stripe s-med"></div>
            <div class="stripe s-bright"></div>
        </div>

    </div><!-- .giant-arcade -->

    <script>
    /* ================================================================
       AUDIO ENGINE (Web Audio API — zero external files)
    ================================================================ */
    let audioCtx   = null;
    let masterGain = null;
    let humOscs    = [];
    let humGain    = null;
    let isMuted    = false;

    function initAudio() {
        if (audioCtx) return;
        audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 1;
        masterGain.connect(audioCtx.destination);
    }

    function resume() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    /* --- Mechanical button clack --- */
    function playClack(force) {
        if (isMuted && !force) return;
        resume();
        const ctx = audioCtx, now = ctx.currentTime;

        // White-noise burst — the "click" texture
        const n = ctx.sampleRate * 0.035;
        const buf = ctx.createBuffer(1, n, ctx.sampleRate);
        const d   = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 1.8);
        const noise = ctx.createBufferSource();
        noise.buffer = buf;
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.38, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        noise.connect(ng); ng.connect(masterGain);
        noise.start(now); noise.stop(now + 0.035);

        // Low thud — the "weight" of the press
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(52, now + 0.055);
        const og = ctx.createGain();
        og.gain.setValueAtTime(0.55, now);
        og.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
        osc.connect(og); og.connect(masterGain);
        osc.start(now); osc.stop(now + 0.06);
    }

    /* --- CRT hum (60Hz electrical drone) --- */
    function startHum() {
        resume();
        const ctx = audioCtx, now = ctx.currentTime;
        humGain = ctx.createGain();
        humGain.gain.setValueAtTime(0, now);
        humGain.gain.linearRampToValueAtTime(0.014, now + 3);
        humGain.connect(masterGain);

        [60, 120, 180, 240].forEach((f, i) => {
            const o = ctx.createOscillator();
            o.type = i === 0 ? 'sawtooth' : 'sine';
            o.frequency.value = f;
            const g = ctx.createGain();
            g.gain.value = 0.65 / (i + 1);
            o.connect(g); g.connect(humGain);
            o.start();
            humOscs.push(o);
        });
    }

    function stopHum() {
        if (!humGain) return;
        const now = audioCtx.currentTime;
        humGain.gain.linearRampToValueAtTime(0, now + 0.6);
        humOscs.forEach(o => { try { o.stop(now + 0.7); } catch(e){} });
        humOscs = [];
        humGain = null;
    }

    /* --- Boot power-on sound --- */
    function playBootSound() {
        resume();
        const ctx = audioCtx, now = ctx.currentTime;

        // Electrical surge
        const surge = ctx.createOscillator();
        surge.type = 'sawtooth';
        surge.frequency.setValueAtTime(28, now);
        surge.frequency.linearRampToValueAtTime(95, now + 0.55);
        const sg = ctx.createGain();
        sg.gain.setValueAtTime(0, now);
        sg.gain.linearRampToValueAtTime(0.45, now + 0.1);
        sg.gain.linearRampToValueAtTime(0, now + 0.55);
        surge.connect(sg); sg.connect(masterGain);
        surge.start(now); surge.stop(now + 0.6);

        // CRT crack (very short noise burst at the line-flash moment)
        const crackN = Math.floor(ctx.sampleRate * 0.06);
        const crackBuf = ctx.createBuffer(1, crackN, ctx.sampleRate);
        const cd = crackBuf.getChannelData(0);
        for (let i = 0; i < crackN; i++) cd[i] = (Math.random()*2-1) * (1 - i/crackN);
        const crack = ctx.createBufferSource();
        crack.buffer = crackBuf;
        const cg = ctx.createGain();
        cg.gain.value = 0.7;
        crack.connect(cg); cg.connect(masterGain);
        crack.start(now + 0.28);

        // Static rush (fades out as picture resolves)
        const statN = Math.floor(ctx.sampleRate * 1.9);
        const statBuf = ctx.createBuffer(1, statN, ctx.sampleRate);
        const sd = statBuf.getChannelData(0);
        for (let i = 0; i < statN; i++) {
            const env = 1 - i/statN;
            sd[i] = (Math.random()*2-1) * env * env;
        }
        const stat = ctx.createBufferSource();
        stat.buffer = statBuf;
        const stg = ctx.createGain();
        stg.gain.setValueAtTime(0, now + 0.32);
        stg.gain.linearRampToValueAtTime(0.55, now + 0.5);
        stg.gain.linearRampToValueAtTime(0, now + 2.2);
        stat.connect(stg); stg.connect(masterGain);
        stat.start(now + 0.32);

        // Resolution chime — C major arpeggio
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const c  = ctx.createOscillator();
            c.type = 'sine';
            c.frequency.value = freq;
            const cg2 = ctx.createGain();
            const t   = now + 2.5 + i * 0.11;
            cg2.gain.setValueAtTime(0, t);
            cg2.gain.linearRampToValueAtTime(0.16, t + 0.04);
            cg2.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
            c.connect(cg2); cg2.connect(masterGain);
            c.start(t); c.stop(t + 0.6);
        });
    }

    /* ================================================================
       BOOT SEQUENCE
    ================================================================ */
    let staticRafId  = null;
    let bootRunning  = false;

    function runBootSequence() {
        if (bootRunning) return;
        bootRunning = true;

        initAudio();
        playBootSound();
        startHum();

        const overlay = document.getElementById('boot-overlay');
        const line    = document.getElementById('boot-line');
        const canvas  = document.getElementById('boot-canvas');

        // Make sure overlay is fully reset
        overlay.style.display = 'flex';
        overlay.style.opacity = '1';
        overlay.classList.remove('resolving');
        canvas.style.transition = 'none';
        canvas.style.opacity    = '0';
        line.style.opacity      = '1';
        line.classList.remove('active');

        // Phase 1 → 280ms: CRT line flash
        setTimeout(() => {
            line.classList.add('active');
        }, 280);

        // Phase 2 → 480ms: canvas static fills screen
        setTimeout(() => {
            line.style.transition = 'opacity 0.15s';
            line.style.opacity    = '0';
            canvas.width  = canvas.offsetWidth  || 500;
            canvas.height = canvas.offsetHeight || 380;
            animateStatic(canvas);
        }, 480);

        // Phase 3 → 2150ms: static fades
        setTimeout(() => {
            stopStatic();
            canvas.style.transition = 'opacity 0.75s ease';
            canvas.style.opacity    = '0';
        }, 2150);

        // Phase 4 → 2750ms: home view appears, overlay fades
        setTimeout(() => {
            switchScreen('view-home');
            overlay.classList.add('resolving');
        }, 2750);

        // Phase 5 → 3600ms: overlay gone
        setTimeout(() => {
            overlay.style.display = 'none';
            bootRunning = false;
        }, 3600);
    }

    function animateStatic(canvas) {
        const ctx2d = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        canvas.style.transition = 'none';
        canvas.style.opacity    = '1';

        function frame() {
            const img  = ctx2d.createImageData(w, h);
            const data = img.data;

            for (let i = 0; i < data.length; i += 4) {
                // Mostly greyscale noise, occasional cyan speck
                const bright = Math.random() > 0.42;
                const v = bright ? Math.floor(Math.random() * 255) : 0;
                data[i]   = v;
                data[i+1] = v;
                data[i+2] = Math.random() > 0.96 ? Math.min(255, v + 80) : v;
                data[i+3] = 255;
            }

            // Occasional horizontal "glitch" bar
            if (Math.random() > 0.85) {
                const row  = Math.floor(Math.random() * h);
                const barH = Math.floor(Math.random() * 6) + 1;
                for (let r = row; r < Math.min(row + barH, h); r++) {
                    for (let c = 0; c < w; c++) {
                        const idx = (r * w + c) * 4;
                        const bv  = Math.floor(Math.random() * 220);
                        data[idx]   = bv;
                        data[idx+1] = bv;
                        data[idx+2] = bv;
                        data[idx+3] = 255;
                    }
                }
            }

            ctx2d.putImageData(img, 0, 0);
            staticRafId = requestAnimationFrame(frame);
        }
        frame();
    }

    function stopStatic() {
        if (staticRafId !== null) {
            cancelAnimationFrame(staticRafId);
            staticRafId = null;
        }
    }

    /* ================================================================
       SCREEN NAVIGATION
    ================================================================ */
    function switchScreen(viewId) {
        document.querySelectorAll('.screen-view').forEach(v => {
            v.classList.remove('active-view');
        });
        const target = document.getElementById(viewId);
        if (target) target.classList.add('active-view');
    }

    function navBtn(target) {
        playClack();
        if (target === 'github') {
            window.open('https://github.com', '_blank');
            return;
        }
        // If currently in game, unload iframe first
        if (document.getElementById('view-game').classList.contains('active-view')) {
            document.getElementById('game-iframe').src = '';
        }
        switchScreen(target);
    }

    function toggleMute() {
        // Play last audible clack before silencing
        if (!isMuted) playClack(true);
        isMuted = !isMuted;
        if (masterGain) {
            masterGain.gain.setTargetAtTime(isMuted ? 0 : 1, audioCtx.currentTime, 0.08);
        }
        document.getElementById('btn-mute').classList.toggle('is-muted', isMuted);
        if (!isMuted) playClack();
    }

    function reboot() {
        playClack();
        stopStatic();
        stopHum();
        document.getElementById('game-iframe').src = '';
        document.querySelectorAll('.screen-view').forEach(v => v.classList.remove('active-view'));
        bootRunning = false;
        setTimeout(runBootSequence, 120);
    }

    /* ================================================================
       GAME LOADING
    ================================================================ */
    const GAMES = {
        'Brick Break':  { title: 'Brick Break',   path: 'games/BRICKBREAK/BRICKBREAK.html'  },
        'stat-blaster':   { title: 'Stat Blaster',     path: 'games/stat-blaster/index.html'   },
        'spire-harvester':{ title: 'Spire Harvester',  path: 'games/spire-harvester/index.html'},
    };

    function loadGame(id) {
        playClack();
        const game = GAMES[id];
        document.getElementById('loading-game-name').textContent = game.title.toUpperCase();
        switchScreen('view-loading');

        const iframe = document.getElementById('game-iframe');
        document.getElementById('game-bar-title').textContent = game.title.toUpperCase();

        // Small delay so the loading screen paints first
        setTimeout(() => {
            iframe.onload = () => {
                setTimeout(() => {
                    if (document.getElementById('view-loading').classList.contains('active-view')) {
                        switchScreen('view-game');
                    }
                }, 300);
            };
            iframe.src = game.path;

            // Hard fallback — if onload never fires (404, cross-origin block), show game anyway
            setTimeout(() => {
                if (document.getElementById('view-loading').classList.contains('active-view')) {
                    switchScreen('view-game');
                }
            }, 3000);
        }, 600);
    }

    function exitGame() {
        playClack();
        document.getElementById('game-iframe').src = '';
        switchScreen('view-library');
    }

    /* ================================================================
       KICK OFF — INSERT COIN
    ================================================================ */
    document.getElementById('insert-coin').addEventListener('click', () => {
        const ic = document.getElementById('insert-coin');
        ic.classList.add('fade-out');
        setTimeout(() => {
            ic.style.display = 'none';
            runBootSequence();
        }, 480);
    });
    </script>
</body>
