<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAVE DEPOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ===========================================================
     CAVE DEPOT — VAPORWAVE PIXEL ART MERCH MACHINE
     =========================================================== */

  :root {
    /* Machine palette */
    --machine-red: #d62828;
    --machine-red-dark: #7a1414;
    --machine-red-darker: #4a0808;
    --machine-red-light: #ff5a5a;
    --machine-cream: #f5e6d3;
    --machine-trim: #2a0a0a;
    --sign-bg: #fff8e7;
    --sign-text: #d62828;
    --led-black: #0a0a0a;
    --led-amber: #ff8800;
    --led-red: #ff2222;
    --led-dim: #2a1400;
    --glass-tint: rgba(40, 80, 70, 0.35);
    --glass-edge: #0d1f1c;
    --shelf-metal: #2a2a30;
    --shelf-metal-light: #4a4a52;

    /* Vaporwave background */
    --bg-deep: #0a0015;
    --bg-mid: #1a0033;
    --bg-purple: #2d1b4e;
    --bg-horizon: #4a1a5e;
    --vw-pink: #ff71ce;
    --vw-cyan: #05d9e8;
    --vw-magenta: #ff006e;
    --vw-purple: #b967ff;
    --vw-sun: #fee440;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'VT323', monospace;
    color: #fff;
    background: var(--bg-deep);
    user-select: none;
  }

  /* ===========================================================
     BACKGROUND — VAPORWAVE CAVE
     =========================================================== */

  .bg-scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background:
      linear-gradient(180deg,
        #0a0015 0%,
        #1a0033 35%,
        #3d1a5e 60%,
        #6b1e5e 80%,
        #2d0a3a 100%);
  }

  /* Pixel sun sinking on horizon */
  .bg-sun {
    position: absolute;
    left: 50%;
    top: 62%;
    width: 240px;
    height: 240px;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(circle,
        #fee440 0%,
        #fee440 30%,
        #ff71ce 50%,
        #ff006e 75%,
        transparent 100%);
    filter: blur(0.5px);
    opacity: 0.55;
  }

  /* Horizontal sun stripes (vaporwave sun) */
  .bg-sun::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      180deg,
      transparent 0px,
      transparent 16px,
      rgba(10, 0, 30, 0.9) 16px,
      rgba(10, 0, 30, 0.9) 20px
    );
    mask: radial-gradient(circle, black 30%, transparent 65%);
    -webkit-mask: radial-gradient(circle, black 30%, transparent 65%);
  }

  /* Perspective grid floor */
  .bg-grid {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40vh;
    perspective: 300px;
    perspective-origin: 50% 0%;
  }

  .bg-grid::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(0deg, transparent 96%, var(--vw-pink) 96%, var(--vw-pink) 100%),
      linear-gradient(90deg, transparent 97%, var(--vw-pink) 97%, var(--vw-pink) 100%);
    background-size: 100% 40px, 40px 100%;
    transform: rotateX(75deg);
    transform-origin: 50% 0%;
    opacity: 0.35;
  }

  /* Stars */
  .bg-stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 10%, white 1px, transparent 1px),
      radial-gradient(1px 1px at 40% 20%, white 1px, transparent 1px),
      radial-gradient(1px 1px at 60% 15%, #fff 1px, transparent 1px),
      radial-gradient(1px 1px at 80% 8%, white 1px, transparent 1px),
      radial-gradient(1px 1px at 15% 30%, white 1px, transparent 1px),
      radial-gradient(1px 1px at 70% 25%, white 1px, transparent 1px),
      radial-gradient(1px 1px at 90% 35%, white 1px, transparent 1px),
      radial-gradient(1px 1px at 30% 40%, white 1px, transparent 1px),
      radial-gradient(1px 1px at 50% 5%, #fee440 1px, transparent 1px),
      radial-gradient(1px 1px at 85% 45%, #05d9e8 1px, transparent 1px);
    background-size: 100% 50vh;
    background-repeat: no-repeat;
    animation: twinkle 4s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 0.4; }
  }

  /* City skyline silhouette */
  .bg-skyline {
    position: absolute;
    bottom: 38vh;
    left: 0;
    right: 0;
    height: 80px;
    background: var(--bg-deep);
    clip-path: polygon(
      0% 100%, 0% 60%, 3% 60%, 3% 45%, 7% 45%, 7% 70%, 10% 70%, 10% 30%, 14% 30%, 14% 55%, 18% 55%, 18% 40%, 22% 40%, 22% 65%, 26% 65%, 26% 50%, 30% 50%, 30% 25%, 34% 25%, 34% 55%, 38% 55%, 38% 35%, 42% 35%, 42% 60%, 46% 60%, 46% 45%, 50% 45%, 50% 20%, 54% 20%, 54% 50%, 58% 50%, 58% 35%, 62% 35%, 62% 60%, 66% 60%, 66% 40%, 70% 40%, 70% 55%, 74% 55%, 74% 30%, 78% 30%, 78% 65%, 82% 65%, 82% 45%, 86% 45%, 86% 55%, 90% 55%, 90% 35%, 94% 35%, 94% 60%, 97% 60%, 97% 50%, 100% 50%, 100% 100%
    );
  }

  /* Lights in city windows */
  .bg-skyline::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 2px at 5% 75%, var(--vw-cyan), transparent),
      radial-gradient(1px 2px at 12% 55%, var(--led-amber), transparent),
      radial-gradient(1px 2px at 20% 75%, var(--vw-pink), transparent),
      radial-gradient(1px 2px at 32% 60%, var(--vw-cyan), transparent),
      radial-gradient(1px 2px at 44% 70%, var(--led-amber), transparent),
      radial-gradient(1px 2px at 56% 65%, var(--vw-pink), transparent),
      radial-gradient(1px 2px at 68% 55%, var(--vw-cyan), transparent),
      radial-gradient(1px 2px at 80% 75%, var(--led-amber), transparent),
      radial-gradient(1px 2px at 92% 65%, var(--vw-pink), transparent);
    mix-blend-mode: screen;
  }

  /* CRT scanlines overlay */
  .bg-scanlines {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.12) 2px,
      rgba(0, 0, 0, 0.12) 4px
    );
    mix-blend-mode: multiply;
  }

  /* ===========================================================
     LAYOUT
     =========================================================== */

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    font-family: 'Press Start 2P', monospace;
    color: var(--vw-pink);
    text-shadow: 0 0 8px var(--vw-magenta), 2px 2px 0 var(--bg-deep);
  }

  .brand {
    font-size: 14px;
    letter-spacing: 2px;
  }

  .brand-cursor {
    display: inline-block;
    color: var(--vw-cyan);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  .top-right {
    display: flex;
    gap: 16px;
    font-size: 9px;
    color: var(--vw-cyan);
    text-shadow: 0 0 6px var(--vw-cyan);
  }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 20px 40px 60px;
  }

  /* ===========================================================
     VENDING MACHINE
     =========================================================== */

  .machine {
    position: relative;
    width: 380px;
    height: 700px;
    flex-shrink: 0;
    filter: drop-shadow(0 20px 40px rgba(255, 0, 110, 0.3));
  }

  /* Machine pedestal shadow */
  .machine::after {
    content: '';
    position: absolute;
    bottom: -30px;
    left: 10%;
    right: 10%;
    height: 24px;
    background: radial-gradient(ellipse, rgba(255, 0, 110, 0.4) 0%, transparent 70%);
    filter: blur(4px);
    z-index: -1;
  }

  .machine-body {
    position: absolute;
    inset: 0;
    background: var(--machine-red);
    border: 4px solid var(--machine-trim);
    border-radius: 6px;
    box-shadow:
      inset 6px 0 0 rgba(255, 255, 255, 0.12),
      inset -6px 0 0 rgba(0, 0, 0, 0.25),
      inset 0 6px 0 rgba(255, 255, 255, 0.15),
      inset 0 -8px 0 rgba(0, 0, 0, 0.3);
  }

  /* Subtle wear/scratches */
  .machine-body::before {
    content: '';
    position: absolute;
    inset: 4px;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.08) 1px, transparent 2px),
      radial-gradient(circle at 70% 50%, rgba(0,0,0,0.08) 1px, transparent 2px),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,0.08) 1px, transparent 2px),
      radial-gradient(circle at 85% 20%, rgba(255,255,255,0.05) 1px, transparent 2px);
    pointer-events: none;
  }

  /* ---- TOP SIGN ---- */
  .machine-sign {
    position: absolute;
    top: 14px;
    left: 20px;
    right: 20px;
    height: 56px;
    background: var(--sign-bg);
    border: 3px solid var(--machine-trim);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    color: var(--sign-text);
    font-size: 14px;
    letter-spacing: 2px;
    text-shadow: 1px 1px 0 #ffd4a3;
    box-shadow:
      inset 0 3px 0 rgba(255, 255, 255, 0.6),
      inset 0 -3px 0 rgba(0, 0, 0, 0.15),
      0 0 0 2px var(--machine-red-dark);
    overflow: hidden;
  }

  .machine-sign::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.4) 0%,
      transparent 40%,
      transparent 60%,
      rgba(0, 0, 0, 0.1) 100%);
    pointer-events: none;
  }

  /* Two small sign-top light bulbs */
  .sign-bulbs {
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 70px;
  }

  .sign-bulb {
    width: 8px;
    height: 8px;
    background: var(--vw-cyan);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--vw-cyan), 0 0 2px white;
    animation: bulb-pulse 2s ease-in-out infinite;
  }

  .sign-bulb:nth-child(2) {
    background: var(--vw-pink);
    box-shadow: 0 0 6px var(--vw-pink), 0 0 2px white;
    animation-delay: 1s;
  }

  @keyframes bulb-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ---- LED DISPLAY ---- */
  .machine-display {
    position: absolute;
    top: 82px;
    left: 30px;
    right: 30px;
    height: 38px;
    background: var(--led-black);
    border: 3px solid var(--machine-trim);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'VT323', monospace;
    color: var(--led-amber);
    font-size: 22px;
    letter-spacing: 3px;
    text-shadow: 0 0 8px var(--led-amber), 0 0 2px var(--led-amber);
    box-shadow:
      inset 0 3px 8px rgba(0, 0, 0, 0.9),
      inset 0 0 20px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }

  /* Display scanlines */
  .machine-display::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 2px,
      rgba(0, 0, 0, 0.4) 2px,
      rgba(0, 0, 0, 0.4) 3px
    );
    pointer-events: none;
  }

  .display-text {
    position: relative;
    z-index: 1;
  }

  .display-text.red {
    color: var(--led-red);
    text-shadow: 0 0 8px var(--led-red);
  }

  /* ---- GLASS WINDOW ---- */
  .machine-window {
    position: absolute;
    top: 134px;
    left: 20px;
    right: 70px;
    height: 400px;
    background: linear-gradient(180deg,
      rgba(20, 40, 35, 0.85) 0%,
      rgba(30, 55, 48, 0.85) 100%);
    border: 4px solid var(--machine-trim);
    border-radius: 3px;
    overflow: hidden;
    box-shadow:
      inset 0 0 0 2px rgba(255, 255, 255, 0.1),
      inset 4px 4px 0 rgba(0, 0, 0, 0.4),
      inset 0 0 30px rgba(0, 0, 0, 0.5);
  }

  /* Glass reflection */
  .machine-window::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 30%;
    height: 100%;
    background: linear-gradient(135deg,
      rgba(255, 255, 255, 0.15) 0%,
      rgba(255, 255, 255, 0.05) 40%,
      transparent 70%);
    pointer-events: none;
    z-index: 10;
  }

  /* Glass scanlines */
  .machine-window::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(0, 0, 0, 0.08) 3px,
      rgba(0, 0, 0, 0.08) 4px
    );
    pointer-events: none;
    z-index: 9;
  }

  .shelves-viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .shelves {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    transform: translateY(0);
  }

  .shelf {
    position: relative;
    height: 120px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: end;
    padding: 0 10px 4px;
    border-bottom: 4px solid var(--shelf-metal);
    box-shadow:
      inset 0 -6px 0 var(--shelf-metal-light),
      inset 0 -10px 4px rgba(0, 0, 0, 0.5);
  }

  /* Shelf glow strip */
  .shelf::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 6px;
    right: 6px;
    height: 3px;
    background: var(--vw-cyan);
    box-shadow: 0 0 12px var(--vw-cyan), 0 2px 8px var(--vw-cyan);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .shelf.lit::before {
    opacity: 0.7;
    animation: shelf-glow 4s ease-in-out infinite;
  }

  @keyframes shelf-glow {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 0.45; }
  }

  /* ---- PRODUCTS ---- */
  .slot {
    position: relative;
    width: 100%;
    height: 100px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    cursor: pointer;
    padding-bottom: 8px;
  }

  .slot:hover .product {
    transform: translateY(-4px);
  }

  .slot-code {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: var(--led-amber);
    background: var(--led-black);
    padding: 2px 4px;
    border-radius: 2px;
    text-shadow: 0 0 3px var(--led-amber);
    z-index: 2;
  }

  .product {
    position: relative;
    width: 44px;
    height: 80px;
    transition: transform 0.2s ease;
    transform-origin: bottom center;
  }

  .product.selected {
    animation: product-select 0.5s ease;
  }

  @keyframes product-select {
    0%, 100% { transform: translateY(-4px) scale(1); }
    50% { transform: translateY(-8px) scale(1.08); }
  }

  .slot.selected .product {
    filter: drop-shadow(0 0 8px var(--vw-cyan)) drop-shadow(0 0 4px var(--vw-cyan));
  }

  .slot.sold-out {
    cursor: not-allowed;
  }

  .slot.sold-out .product {
    opacity: 0.25;
    filter: grayscale(1);
  }

  .slot.sold-out::after {
    content: 'SOLD';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-15deg);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--led-red);
    text-shadow: 0 0 6px var(--led-red), 1px 1px 0 black;
    z-index: 3;
  }

  /* Product sprite styles - bottle, can, box */
  .product.bottle {
    width: 28px;
  }

  .product.bottle .p-top {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 8px;
    background: #1a1a1a;
    border-radius: 2px 2px 0 0;
  }

  .product.bottle .p-neck {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 10px;
    background: var(--p-color);
    box-shadow:
      inset -2px 0 0 rgba(0, 0, 0, 0.3),
      inset 2px 0 0 rgba(255, 255, 255, 0.2);
  }

  .product.bottle .p-body {
    position: absolute;
    top: 18px;
    left: 0;
    width: 28px;
    height: 62px;
    background: var(--p-color);
    border-radius: 2px;
    box-shadow:
      inset -3px 0 0 rgba(0, 0, 0, 0.3),
      inset 3px 0 0 rgba(255, 255, 255, 0.2),
      inset 0 -3px 0 rgba(0, 0, 0, 0.4);
  }

  .product.bottle .p-label {
    position: absolute;
    top: 34px;
    left: 2px;
    right: 2px;
    height: 30px;
    background: var(--p-label);
    border: 1px solid rgba(0, 0, 0, 0.4);
  }

  .product.bottle .p-label::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 3px;
    right: 3px;
    height: 2px;
    background: rgba(255, 255, 255, 0.6);
  }

  .product.bottle .p-label::after {
    content: '';
    position: absolute;
    bottom: 4px;
    left: 3px;
    right: 3px;
    height: 2px;
    background: rgba(255, 255, 255, 0.4);
  }

  /* Can style */
  .product.can {
    width: 32px;
  }

  .product.can .p-body {
    position: absolute;
    top: 8px;
    left: 0;
    width: 32px;
    height: 72px;
    background: var(--p-color);
    border-radius: 1px;
    box-shadow:
      inset -4px 0 0 rgba(0, 0, 0, 0.3),
      inset 3px 0 0 rgba(255, 255, 255, 0.25),
      inset 0 -2px 0 rgba(0, 0, 0, 0.4),
      inset 0 2px 0 rgba(255, 255, 255, 0.3);
  }

  .product.can .p-top {
    position: absolute;
    top: 0;
    left: 2px;
    right: 2px;
    height: 8px;
    background: #c0c0c8;
    box-shadow:
      inset 0 -2px 0 #808088,
      inset 0 2px 0 #e0e0e8;
  }

  .product.can .p-label {
    position: absolute;
    top: 22px;
    left: 0;
    right: 0;
    height: 42px;
    background: var(--p-label);
    border-top: 1px solid rgba(0, 0, 0, 0.4);
    border-bottom: 1px solid rgba(0, 0, 0, 0.4);
  }

  .product.can .p-label::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 4px;
    right: 4px;
    height: 6px;
    transform: translateY(-50%);
    background:
      linear-gradient(90deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(255, 255, 255, 0.5) 20%,
        transparent 20%,
        transparent 30%,
        rgba(255, 255, 255, 0.5) 30%,
        rgba(255, 255, 255, 0.5) 60%,
        transparent 60%,
        transparent 70%,
        rgba(255, 255, 255, 0.5) 70%,
        rgba(255, 255, 255, 0.5) 100%);
  }

  /* Box style */
  .product.box {
    width: 40px;
    height: 70px;
  }

  .product.box .p-body {
    position: absolute;
    top: 10px;
    left: 0;
    width: 40px;
    height: 60px;
    background: var(--p-color);
    box-shadow:
      inset -3px 0 0 rgba(0, 0, 0, 0.3),
      inset 3px 0 0 rgba(255, 255, 255, 0.2),
      inset 0 -3px 0 rgba(0, 0, 0, 0.35),
      inset 0 3px 0 rgba(255, 255, 255, 0.3);
  }

  .product.box .p-label {
    position: absolute;
    top: 24px;
    left: 4px;
    right: 4px;
    height: 24px;
    background: var(--p-label);
  }

  .product.box .p-label::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 2px;
    right: 2px;
    height: 3px;
    background: rgba(0, 0, 0, 0.6);
  }

  .product.box .p-label::after {
    content: '';
    position: absolute;
    top: 12px;
    left: 2px;
    right: 2px;
    height: 2px;
    background: rgba(0, 0, 0, 0.4);
  }

  /* ---- SIDE CONTROL PANEL ---- */
  .machine-controls {
    position: absolute;
    top: 134px;
    right: 20px;
    width: 44px;
    height: 400px;
    background: var(--machine-red-dark);
    border: 3px solid var(--machine-trim);
    border-radius: 3px;
    padding: 10px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    box-shadow:
      inset 2px 2px 0 rgba(255, 255, 255, 0.1),
      inset -2px -2px 0 rgba(0, 0, 0, 0.4);
  }

  .arrow-btn {
    width: 32px;
    height: 32px;
    background: var(--machine-cream);
    border: 2px solid var(--machine-trim);
    border-radius: 3px;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    color: var(--machine-red-dark);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      inset 2px 2px 0 rgba(255, 255, 255, 0.6),
      inset -2px -2px 0 rgba(0, 0, 0, 0.25),
      0 2px 0 rgba(0, 0, 0, 0.5);
    transition: transform 0.06s, box-shadow 0.06s;
    padding: 0;
  }

  .arrow-btn:hover {
    background: #ffebd1;
  }

  .arrow-btn:active,
  .arrow-btn.pressed {
    transform: translateY(2px);
    box-shadow:
      inset 2px 2px 0 rgba(0, 0, 0, 0.2),
      inset -2px -2px 0 rgba(255, 255, 255, 0.3);
  }

  .arrow-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3px;
    margin-top: 6px;
  }

  .kp-btn {
    width: 14px;
    height: 14px;
    background: var(--machine-trim);
    border: 1px solid #000;
    border-radius: 2px;
    font-family: 'Press Start 2P', monospace;
    font-size: 5px;
    color: var(--machine-cream);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.15);
    padding: 0;
    cursor: pointer;
  }

  /* Coin slot */
  .coin-slot {
    margin-top: auto;
    width: 28px;
    height: 16px;
    background: #000;
    border: 2px solid var(--machine-trim);
    border-radius: 2px;
    position: relative;
    box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.8);
  }

  .coin-slot::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 3px;
    background: #000;
    border: 1px solid #222;
  }

  .coin-slot::after {
    content: '¢';
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: var(--machine-cream);
  }

  /* ---- DISPENSE TRAY ---- */
  .dispense-tray {
    position: absolute;
    bottom: 70px;
    left: 20px;
    right: 20px;
    height: 60px;
    background: var(--machine-red-darker);
    border: 3px solid var(--machine-trim);
    border-radius: 3px;
    box-shadow:
      inset 0 4px 12px rgba(0, 0, 0, 0.8),
      inset 0 -2px 0 rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }

  .tray-opening {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    height: 8px;
    background: #000;
    border-radius: 2px;
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.9);
  }

  .tray-flap {
    position: absolute;
    top: 20px;
    left: 10px;
    right: 10px;
    height: 28px;
    background: linear-gradient(180deg, #222 0%, #0a0a0a 100%);
    border: 1px solid var(--machine-trim);
    border-radius: 2px;
    transform-origin: top;
    transition: transform 0.3s;
  }

  .tray-flap.open {
    transform: rotateX(-70deg);
  }

  .tray-label {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: var(--machine-cream);
    letter-spacing: 1px;
  }

  /* ---- BOTTOM GRILLE ---- */
  .machine-grille {
    position: absolute;
    bottom: 14px;
    left: 20px;
    right: 20px;
    height: 46px;
    background: var(--machine-red-dark);
    border: 3px solid var(--machine-trim);
    border-radius: 3px;
    background-image: repeating-linear-gradient(
      90deg,
      var(--machine-red-darker) 0px,
      var(--machine-red-darker) 3px,
      var(--machine-red-dark) 3px,
      var(--machine-red-dark) 7px
    );
    box-shadow:
      inset 0 2px 0 rgba(0, 0, 0, 0.4),
      inset 0 -2px 0 rgba(255, 255, 255, 0.08);
  }

  /* Falling product during dispense */
  .falling-product {
    position: absolute;
    z-index: 20;
    pointer-events: none;
  }

  /* ===========================================================
     SIDE PANEL
     =========================================================== */

  .panel {
    width: 340px;
    min-height: 540px;
    background: rgba(10, 0, 30, 0.85);
    border: 3px solid var(--vw-pink);
    border-radius: 4px;
    padding: 28px 24px;
    box-shadow:
      0 0 0 1px rgba(255, 113, 206, 0.4),
      0 0 40px rgba(255, 113, 206, 0.3),
      inset 0 0 60px rgba(181, 103, 255, 0.1);
    font-family: 'VT323', monospace;
    position: relative;
    backdrop-filter: blur(8px);
  }

  /* Corner brackets */
  .panel::before,
  .panel::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border: 3px solid var(--vw-cyan);
  }

  .panel::before {
    top: -3px;
    left: -3px;
    border-right: none;
    border-bottom: none;
  }

  .panel::after {
    bottom: -3px;
    right: -3px;
    border-left: none;
    border-top: none;
  }

  .panel-header {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--vw-cyan);
    text-shadow: 0 0 6px var(--vw-cyan);
    letter-spacing: 2px;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 2px dashed rgba(5, 217, 232, 0.3);
  }

  .panel-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 60px 0;
    text-align: center;
  }

  .empty-icon {
    width: 80px;
    height: 80px;
    border: 3px dashed var(--vw-pink);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--vw-pink);
    animation: spin 8s linear infinite;
    opacity: 0.6;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .empty-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--vw-pink);
    letter-spacing: 1px;
    line-height: 1.8;
    text-shadow: 0 0 6px rgba(255, 113, 206, 0.6);
  }

  .empty-sub {
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 8px;
  }

  .panel-product {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .pp-code {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--led-amber);
    background: var(--led-black);
    padding: 6px 10px;
    display: inline-block;
    align-self: flex-start;
    text-shadow: 0 0 6px var(--led-amber);
    border: 1px solid var(--led-amber);
  }

  .pp-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: white;
    line-height: 1.4;
    text-shadow: 2px 2px 0 var(--vw-magenta), 4px 4px 0 rgba(181, 103, 255, 0.4);
    letter-spacing: 1px;
  }

  .pp-divider {
    height: 2px;
    background: repeating-linear-gradient(90deg,
      var(--vw-pink) 0px,
      var(--vw-pink) 4px,
      transparent 4px,
      transparent 8px);
  }

  .pp-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'VT323', monospace;
  }

  .pp-price-label {
    font-size: 14px;
    color: var(--vw-cyan);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .pp-price {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: var(--vw-sun);
    text-shadow: 0 0 8px var(--vw-sun), 2px 2px 0 var(--vw-magenta);
  }

  .pp-desc {
    font-family: 'VT323', monospace;
    font-size: 18px;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.85);
    min-height: 60px;
  }

  .buy-btn {
    margin-top: 12px;
    padding: 16px;
    background: var(--vw-magenta);
    border: 3px solid white;
    color: white;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow:
      inset 2px 2px 0 rgba(255, 255, 255, 0.3),
      inset -2px -2px 0 rgba(0, 0, 0, 0.3),
      0 4px 0 var(--machine-red-darker),
      0 0 20px rgba(255, 0, 110, 0.5);
    transition: transform 0.06s, box-shadow 0.06s;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
  }

  .buy-btn:hover {
    background: #ff1a7a;
  }

  .buy-btn:active {
    transform: translateY(3px);
    box-shadow:
      inset 2px 2px 0 rgba(0, 0, 0, 0.2),
      inset -2px -2px 0 rgba(255, 255, 255, 0.15),
      0 1px 0 var(--machine-red-darker),
      0 0 20px rgba(255, 0, 110, 0.5);
  }

  .buy-btn:disabled {
    background: #555;
    border-color: #333;
    color: #888;
    cursor: not-allowed;
    box-shadow:
      inset 2px 2px 0 rgba(255, 255, 255, 0.1),
      inset -2px -2px 0 rgba(0, 0, 0, 0.3);
    transform: none;
    text-shadow: none;
  }

  /* ===========================================================
     INTRO OVERLAY — INSERT COIN
     =========================================================== */

  .intro-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(10, 0, 20, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(2px);
    transition: opacity 0.6s;
  }

  .intro-overlay.hiding {
    opacity: 0;
    pointer-events: none;
  }

  .intro-content {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  .intro-logo {
    font-family: 'Press Start 2P', monospace;
    font-size: 38px;
    color: var(--vw-pink);
    text-shadow:
      4px 4px 0 var(--vw-magenta),
      8px 8px 0 var(--vw-cyan),
      0 0 20px var(--vw-pink);
    letter-spacing: 6px;
    animation: logo-float 3s ease-in-out infinite;
  }

  @keyframes logo-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .intro-tagline {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--vw-cyan);
    letter-spacing: 3px;
    text-shadow: 0 0 8px var(--vw-cyan);
  }

  .intro-coin-prompt {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: white;
    letter-spacing: 3px;
    animation: coin-blink 1s step-end infinite;
    text-shadow: 2px 2px 0 var(--vw-magenta);
  }

  @keyframes coin-blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.2; }
  }

  .flying-coin {
    position: fixed;
    width: 32px;
    height: 32px;
    z-index: 201;
    pointer-events: none;
  }

  .coin-sprite {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff8a0, #fee440 40%, #d4a017 70%, #8b6914 100%);
    border: 2px solid #8b6914;
    box-shadow:
      0 0 12px var(--vw-sun),
      inset 2px 2px 4px rgba(255, 255, 255, 0.6),
      inset -2px -2px 4px rgba(0, 0, 0, 0.3);
    position: relative;
  }

  .coin-sprite::after {
    content: '¢';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: #8b6914;
    text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.5);
  }

  /* ===========================================================
     MUTE BUTTON
     =========================================================== */

  .mute-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 50;
    width: 48px;
    height: 48px;
    background: rgba(10, 0, 30, 0.85);
    border: 2px solid var(--vw-cyan);
    border-radius: 4px;
    color: var(--vw-cyan);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(5, 217, 232, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 0 4px var(--vw-cyan);
    transition: all 0.15s;
  }

  .mute-btn:hover {
    background: rgba(5, 217, 232, 0.2);
  }

  /* ===========================================================
     MOBILE FALLBACK
     =========================================================== */

  .mobile-grid {
    display: none;
  }

  @media (max-width: 900px) {
    .stage { display: none; }
    .intro-overlay { display: none; }

    .mobile-grid {
      display: block;
      padding: 20px;
      padding-bottom: 60px;
    }

    .mobile-header {
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
      color: var(--vw-pink);
      text-shadow: 3px 3px 0 var(--vw-magenta), 0 0 12px var(--vw-pink);
      text-align: center;
      padding: 30px 0 10px;
      letter-spacing: 4px;
    }

    .mobile-sub {
      text-align: center;
      font-family: 'VT323', monospace;
      font-size: 20px;
      color: var(--vw-cyan);
      margin-bottom: 30px;
    }

    .mobile-machine {
      max-width: 500px;
      margin: 0 auto;
      background: var(--machine-red);
      border: 4px solid var(--machine-trim);
      border-radius: 8px;
      padding: 20px 16px;
      box-shadow:
        inset 0 4px 0 rgba(255, 255, 255, 0.15),
        inset 0 -4px 0 rgba(0, 0, 0, 0.3),
        0 8px 24px rgba(255, 0, 110, 0.3);
    }

    .mobile-machine-sign {
      background: var(--sign-bg);
      border: 3px solid var(--machine-trim);
      padding: 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--sign-text);
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 16px;
      border-radius: 4px;
    }

    .mobile-products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      background: rgba(20, 40, 35, 0.5);
      border: 3px solid var(--machine-trim);
      padding: 12px;
      border-radius: 4px;
    }

    .mobile-card {
      background: #0f2220;
      border: 2px solid var(--shelf-metal);
      border-radius: 3px;
      padding: 10px 8px;
      text-align: center;
      position: relative;
    }

    .mobile-card-product {
      margin: 0 auto 8px;
      height: 60px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--shelf-metal);
    }

    .mobile-card-product .product {
      transform: scale(0.7);
    }

    .mobile-card-code {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--led-amber);
      margin-bottom: 4px;
    }

    .mobile-card-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: white;
      line-height: 1.4;
      margin-bottom: 6px;
      min-height: 20px;
      letter-spacing: 0.5px;
    }

    .mobile-card-price {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--vw-sun);
      text-shadow: 0 0 4px var(--vw-sun);
      margin-bottom: 8px;
    }

    .mobile-buy {
      width: 100%;
      padding: 6px;
      background: var(--vw-magenta);
      border: 2px solid white;
      color: white;
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .mobile-buy:disabled {
      background: #555;
      border-color: #333;
      color: #888;
    }
  }
</style>
</head>

    { code: 'C3', name: 'HOLO STICKER',   price: 6,  type: 'box',    color: '#b967ff', label: '#05d9e8', desc: 'Holographic foil sticker. Catches light in 5 directions.' },

    { code: 'D1', name: 'CYBER SOCKS',    price: 14, type: 'can',    color: '#3498db', label: '#ffffff', desc: 'Knit crew socks with grid pattern. One size fits most.' },
    { code: 'D2', name: 'ACID HOODIE',    price: 65, type: 'bottle', color: '#7fff00', label: '#1a0033', desc: 'Heavyweight zip-up with acid wash. Embroidered chest logo.' },
    { code: 'D3', name: 'DESKTOP PACK',   price: 10, type: 'box',    color: '#ecf0f1', label: '#ff006e', desc: 'Digital download — 12 wallpapers in 4K + mobile sizes.' },

    { code: 'E1', name: 'RETRO MUG',      price: 20, type: 'can',    color: '#ff7f50', label: '#2c3e50', desc: 'Glazed ceramic mug. 12oz. Dishwasher safe, microwave reckless.' },
    { code: 'E2', name: 'SYNTH PATCH',    price: 9,  type: 'bottle', color: '#05d9e8', label: '#ff006e', desc: 'Iron-on embroidered patch. 3 inch. Self-adhesive backing.' },
  ];

  /* ===========================================================
     STATE
     =========================================================== */
  const state = {
    started: false,
    scrollIndex: 0,
    maxScroll: 0,
    selectedCode: null,
    dispensed: new Set(),
    muted: false,
    audioCtx: null,
    ambientGain: null,
  };

  const PRODUCTS_PER_ROW = 3;
  const ROW_HEIGHT = 120; // px
  const VISIBLE_ROWS = 3; // 3 rows fit in 400px window
  const totalRows = Math.ceil(PRODUCTS.length / PRODUCTS_PER_ROW);
  state.maxScroll = Math.max(0, totalRows - VISIBLE_ROWS);

  /* ===========================================================
     AUDIO (Web Audio API — synthesized)
     =========================================================== */
  function initAudio() {
    if (state.audioCtx) return;
    try {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { console.warn('No audio'); }
  }

  function beep({ freq = 440, dur = 0.1, type = 'square', gain = 0.15, glide = null, filter = null }) {
    if (!state.audioCtx || state.muted) return;
    const ctx = state.audioCtx;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (glide) {
      osc.frequency.exponentialRampToValueAtTime(glide, ctx.currentTime + dur);
    }
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);

    if (filter) {
      const biquad = ctx.createBiquadFilter();
      biquad.type = filter.type || 'lowpass';
      biquad.frequency.value = filter.freq || 1000;
      osc.connect(biquad); biquad.connect(g);
    } else {
      osc.connect(g);
    }
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.05);
  }

  function playCoinClink() {
    beep({ freq: 1800, dur: 0.08, type: 'triangle', gain: 0.12 });
    setTimeout(() => beep({ freq: 2400, dur: 0.12, type: 'triangle', gain: 0.1, glide: 1200 }), 70);
    setTimeout(() => beep({ freq: 1600, dur: 0.18, type: 'triangle', gain: 0.08, glide: 800 }), 180);
  }

  function playClick() {
    beep({ freq: 800, dur: 0.04, type: 'square', gain: 0.08 });
  }

  function playWhir() {
    if (!state.audioCtx || state.muted) return;
    const ctx = state.audioCtx;
    const bufferSize = ctx.sampleRate * 0.35;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 600;
    filt.Q.value = 2;
    const g = ctx.createGain();
    g.gain.value = 0.08;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start();
  }

  function playBlip() {
    beep({ freq: 1400, dur: 0.06, type: 'square', gain: 0.1 });
    setTimeout(() => beep({ freq: 2000, dur: 0.08, type: 'square', gain: 0.1 }), 70);
  }

  function playDispense() {
    // motor whir
    playWhir();
    // thunk after delay
    setTimeout(() => {
      beep({ freq: 80, dur: 0.25, type: 'sine', gain: 0.25, glide: 40 });
      beep({ freq: 150, dur: 0.15, type: 'triangle', gain: 0.15, glide: 60 });
    }, 800);
  }

  function playError() {
    beep({ freq: 300, dur: 0.12, type: 'sawtooth', gain: 0.12 });
    setTimeout(() => beep({ freq: 200, dur: 0.18, type: 'sawtooth', gain: 0.12, glide: 120 }), 130);
  }

  function startAmbientHum() {
    if (!state.audioCtx || state.muted || state.ambientGain) return;
    const ctx = state.audioCtx;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 55;
    const g = ctx.createGain();
    g.gain.value = 0.015;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 120;
    osc.connect(filt); filt.connect(g); g.connect(ctx.destination);
    osc.start();
    state.ambientGain = g;
    state.ambientOsc = osc;
  }

  /* ===========================================================
     PRODUCT RENDERING
     =========================================================== */
  function productSpriteHTML(p) {
    const style = `--p-color:${p.color};--p-label:${p.label};`;
    if (p.type === 'bottle') {
      return `<div class="product bottle" style="${style}">
        <div class="p-top"></div>
        <div class="p-neck"></div>
        <div class="p-body"><div class="p-label"></div></div>
      </div>`;
    } else if (p.type === 'can') {
      return `<div class="product can" style="${style}">
        <div class="p-top"></div>
        <div class="p-body"><div class="p-label"></div></div>
      </div>`;
    } else {
      return `<div class="product box" style="${style}">
        <div class="p-body"><div class="p-label"></div></div>
      </div>`;
    }
  }

  function renderShelves() {
    const shelves = document.getElementById('shelves');
    let html = '';
    for (let row = 0; row < totalRows; row++) {
      html += '<div class="shelf">';
      for (let col = 0; col < PRODUCTS_PER_ROW; col++) {
        const idx = row * PRODUCTS_PER_ROW + col;
        const p = PRODUCTS[idx];
        if (p) {
          html += `<div class="slot" data-code="${p.code}">
            <span class="slot-code">${p.code}</span>
            ${productSpriteHTML(p)}
          </div>`;
        } else {
          html += `<div class="slot empty"></div>`;
        }
      }
      html += '</div>';
    }
    shelves.innerHTML = html;

    // attach listeners
    shelves.querySelectorAll('.slot[data-code]').forEach(el => {
      el.addEventListener('click', () => {
        selectProduct(el.dataset.code);
      });
    });
  }

  function renderMobile() {
    const grid = document.getElementById('mobile-products');
    if (!grid) return;
    grid.innerHTML = PRODUCTS.map(p => `
      <div class="mobile-card" data-code="${p.code}">
        <div class="mobile-card-product">${productSpriteHTML(p)}</div>
        <div class="mobile-card-code">${p.code}</div>
        <div class="mobile-card-name">${p.name}</div>
        <div class="mobile-card-price">$${p.price}</div>
        <button class="mobile-buy">BUY</button>
      </div>
    `).join('');
  }

  /* ===========================================================
     INTRO SEQUENCE
     =========================================================== */
  function startIntro() {
    if (state.started) return;
    state.started = true;
    initAudio();
    // resume if needed
    if (state.audioCtx.state === 'suspended') state.audioCtx.resume();

    // Create flying coin
    const coin = document.createElement('div');
    coin.className = 'flying-coin';
    coin.innerHTML = '<div class="coin-sprite"></div>';
    document.body.appendChild(coin);

    const intro = document.getElementById('intro');
    const prompt = intro.querySelector('.intro-coin-prompt');
    prompt.style.animation = 'none';

    // Position coin at center
    const introRect = intro.getBoundingClientRect();
    coin.style.left = (introRect.width / 2 - 16) + 'px';
    coin.style.top = (introRect.height / 2 - 16) + 'px';

    // Find coin slot target
    const slot = document.querySelector('.coin-slot');
    const slotRect = slot.getBoundingClientRect();

    playCoinClink();

    // Animate coin: spin + travel to slot
    anime({
      targets: coin,
      left: slotRect.left - 2,
      top: slotRect.top - 2,
      rotate: [0, 720],
      scale: [1.2, 0.3],
      duration: 900,
      easing: 'easeInQuad',
      complete: () => {
        coin.remove();
        // fade intro
        intro.classList.add('hiding');
        setTimeout(() => { intro.style.display = 'none'; }, 600);
        bootMachine();
      }
    });

    // Pulse intro off
    anime({
      targets: '.intro-content',
      opacity: [1, 0],
      scale: [1, 0.92],
      duration: 600,
      easing: 'easeInQuad'
    });
  }

  function bootMachine() {
    const display = document.getElementById('display');
    const sign = document.querySelector('.machine-sign');

    // Flicker sequence for sign
    const flickerSeq = [0.3, 1, 0.2, 1, 0.6, 1];
    flickerSeq.forEach((val, i) => {
      setTimeout(() => { sign.style.opacity = val; }, i * 80);
    });

    // Display boot sequence
    const bootTexts = ['----', 'BOOT..', 'HELLO.', 'CAVE DEPOT', 'SELECT ITEM'];
    bootTexts.forEach((txt, i) => {
      setTimeout(() => {
        display.textContent = txt;
        if (i < bootTexts.length - 1) playClick();
      }, 600 + i * 400);
    });

    // Light up shelves one by one
    const shelves = document.querySelectorAll('.shelf');
    shelves.forEach((sh, i) => {
      setTimeout(() => {
        sh.classList.add('lit');
        playClick();
      }, 800 + i * 180);
    });

    // Start ambient hum after boot
    setTimeout(() => {
      startAmbientHum();
    }, 1800);

    // Animate panel in (already visible, just pulse)
    anime({
      targets: '.panel',
      opacity: [0, 1],
      translateX: [40, 0],
      duration: 800,
      delay: 400,
      easing: 'easeOutQuad'
    });
  }

  /* ===========================================================
     SHELF SCROLLING
     =========================================================== */
  function updateScrollButtons() {
    const btnUp = document.getElementById('btn-up');
    const btnDown = document.getElementById('btn-down');
    btnUp.disabled = state.scrollIndex <= 0;
    btnDown.disabled = state.scrollIndex >= state.maxScroll;
  }

  function scrollShelves(direction) {
    const newIndex = state.scrollIndex + direction;
    if (newIndex < 0 || newIndex > state.maxScroll) {
      playError();
      return;
    }
    state.scrollIndex = newIndex;
    playWhir();
    playClick();

    const shelves = document.getElementById('shelves');
    anime({
      targets: shelves,
      translateY: -state.scrollIndex * ROW_HEIGHT,
      duration: 450,
      easing: 'easeInOutQuad',
    });

    // Small shake at end
    setTimeout(() => {
      anime({
        targets: shelves,
        translateY: [
          { value: -state.scrollIndex * ROW_HEIGHT - 2, duration: 60 },
          { value: -state.scrollIndex * ROW_HEIGHT, duration: 80 },
        ],
        easing: 'easeInOutQuad'
      });
    }, 450);

    updateScrollButtons();
  }

  /* ===========================================================
     PRODUCT SELECTION
     =========================================================== */
  function selectProduct(code) {
    const product = PRODUCTS.find(p => p.code === code);
    if (!product) return;

    if (state.dispensed.has(code)) {
      playError();
      flashDisplay('SOLD OUT!', true);
      return;
    }

    playBlip();
    state.selectedCode = code;

    // Visual: mark selected
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
    const slot = document.querySelector(`.slot[data-code="${code}"]`);
    if (slot) {
      slot.classList.add('selected');
      const sprite = slot.querySelector('.product');
      sprite.classList.remove('selected');
      void sprite.offsetWidth; // reflow
      sprite.classList.add('selected');
    }

    // Update display
    flashDisplay(`> ${code} ${product.name}`);

    // Update panel
    updatePanel(product);
  }

  function updatePanel(product) {
    document.getElementById('panel-empty').style.display = 'none';
    const pp = document.getElementById('panel-product');
    pp.style.display = 'flex';

    // Typewriter effect
    const nameEl = document.getElementById('pp-name');
    const descEl = document.getElementById('pp-desc');
    document.getElementById('pp-code').textContent = `SLOT ${product.code}`;
    document.getElementById('pp-price').textContent = `$${product.price}`;

    typewriter(nameEl, product.name, 40);
    setTimeout(() => typewriter(descEl, product.desc, 15), 300);

    // Enable/disable buy
    const btn = document.getElementById('buy-btn');
    if (state.dispensed.has(product.code)) {
      btn.disabled = true;
      btn.textContent = 'SOLD OUT';
    } else {
      btn.disabled = false;
      btn.textContent = 'BUY NOW';
    }

    // Panel pulse
    anime({
      targets: '.panel',
      scale: [
        { value: 1.015, duration: 120 },
        { value: 1, duration: 200 }
      ],
      easing: 'easeOutQuad'
    });
  }

  function typewriter(el, text, speed = 30) {
    el.textContent = '';
    let i = 0;
    const tick = () => {
      if (i < text.length) {
        el.textContent += text[i];
        i++;
        setTimeout(tick, speed);
      }
    };
    tick();
  }

  function flashDisplay(text, red = false) {
    const display = document.getElementById('display');
    display.textContent = text;
    if (red) display.classList.add('red');
    else display.classList.remove('red');
  }

  /* ===========================================================
     DISPENSE SEQUENCE
     =========================================================== */
  function dispense() {
    const code = state.selectedCode;
    if (!code || state.dispensed.has(code)) return;
    const product = PRODUCTS.find(p => p.code === code);
    if (!product) return;

    const btn = document.getElementById('buy-btn');
    btn.disabled = true;

    playDispense();

    // Animated "DISPENSING..." with dots
    const display = document.getElementById('display');
    display.classList.remove('red');
    let dots = 0;
    const dispInterval = setInterval(() => {
      dots = (dots + 1) % 4;
      display.textContent = 'DISPENSING' + '.'.repeat(dots);
    }, 200);

    // Clone product and drop it
    const slot = document.querySelector(`.slot[data-code="${code}"]`);
    const sprite = slot.querySelector('.product');
    const spriteRect = sprite.getBoundingClientRect();
    const machineRect = document.getElementById('machine').getBoundingClientRect();
    const trayRect = document.querySelector('.dispense-tray').getBoundingClientRect();

    const falling = document.createElement('div');
    falling.className = 'falling-product';
    falling.innerHTML = productSpriteHTML(product);
    falling.style.left = (spriteRect.left - machineRect.left) + 'px';
    falling.style.top = (spriteRect.top - machineRect.top) + 'px';
    document.getElementById('machine').appendChild(falling);

    const targetX = (trayRect.left - machineRect.left) + (trayRect.width / 2) - 20;
    const targetY = (trayRect.top - machineRect.top) + 20;

    // Tray opens
    setTimeout(() => {
      document.getElementById('tray-flap').classList.add('open');
    }, 600);

    // Coin-drop physics (tumble & fall)
    anime({
      targets: falling,
      keyframes: [
        { left: spriteRect.left - machineRect.left, top: spriteRect.top - machineRect.top, rotate: 0, duration: 0 },
        { left: spriteRect.left - machineRect.left, top: spriteRect.top - machineRect.top + 30, rotate: 20, duration: 300, easing: 'easeInQuad' },
        { left: targetX, top: targetY, rotate: -360, duration: 500, easing: 'easeInQuad' }
      ],
      complete: () => {
        // bounce a tiny bit
        anime({
          targets: falling,
          top: targetY - 4,
          duration: 100,
          direction: 'alternate',
          loop: 2,
          easing: 'easeOutQuad',
          complete: () => {
            // fade out and close tray
            setTimeout(() => {
              document.getElementById('tray-flap').classList.remove('open');
              anime({
                targets: falling,
                opacity: 0,
                duration: 600,
                delay: 400,
                complete: () => falling.remove()
              });

              // Mark as dispensed
              state.dispensed.add(code);
              slot.classList.add('sold-out');

              clearInterval(dispInterval);
              display.classList.add('red');
              display.textContent = 'SOLD OUT';

              // blink display
              let blinks = 0;
              const blinkInt = setInterval(() => {
                display.style.opacity = display.style.opacity === '0.2' ? '1' : '0.2';
                blinks++;
                if (blinks >= 6) {
                  clearInterval(blinkInt);
                  display.style.opacity = '1';
                  setTimeout(() => {
                    display.classList.remove('red');
                    display.textContent = 'SELECT ITEM';
                  }, 1200);
                }
              }, 200);

              btn.textContent = 'SOLD OUT';
              playError();
            }, 400);
          }
        });
      }
    });
  }

  /* ===========================================================
     AMBIENT — sign flicker
     =========================================================== */
  function scheduleFlicker() {
    const nextIn = 5000 + Math.random() * 12000;
    setTimeout(() => {
      if (!state.started) { scheduleFlicker(); return; }
      const sign = document.querySelector('.machine-sign');
      const seq = [0.4, 1, 0.2, 1];
      seq.forEach((val, i) => {
        setTimeout(() => { sign.style.opacity = val; }, i * 60);
      });
      scheduleFlicker();
    }, nextIn);
  }

  /* ===========================================================
     INITIALIZATION
     =========================================================== */
  function init() {
    renderShelves();
    renderMobile();
    updateScrollButtons();

    // Intro click
    document.getElementById('intro').addEventListener('click', startIntro);

    // Arrow buttons
    document.getElementById('btn-up').addEventListener('click', () => scrollShelves(-1));
    document.getElementById('btn-down').addEventListener('click', () => scrollShelves(1));

    // Keyboard
    document.addEventListener('keydown', e => {
      if (!state.started) {
        if (e.key === 'Enter' || e.key === ' ') startIntro();
        return;
      }
      if (e.key === 'ArrowUp') scrollShelves(-1);
      else if (e.key === 'ArrowDown') scrollShelves(1);
    });

    // Buy button
    document.getElementById('buy-btn').addEventListener('click', dispense);

    // Mute
    document.getElementById('mute-btn').addEventListener('click', () => {
      state.muted = !state.muted;
      document.getElementById('mute-btn').textContent = state.muted ? '♪̸' : '♪';
      if (state.muted && state.ambientGain) {
        state.ambientGain.gain.value = 0;
      } else if (!state.muted && state.ambientGain) {
        state.ambientGain.gain.value = 0.015;
      }
    });

    // Mobile buy buttons
    document.addEventListener('click', e => {
      if (e.target.classList.contains('mobile-buy')) {
        const card = e.target.closest('.mobile-card');
        if (card) {
          e.target.textContent = 'SOLD OUT';
          e.target.disabled = true;
        }
      }
    });

    // Keypad buttons (decorative but play click)
    document.querySelectorAll('.kp-btn').forEach(b => {
      b.addEventListener('click', () => {
        if (state.started) playClick();
      });
    });

    scheduleFlicker();
  }

  init();
</script>
</body>
</html>
