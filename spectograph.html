<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGNAL_PROCESSOR // v.09</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .rack-unit {
      width: 600px;
      background: linear-gradient(180deg, #333 0%, #111 100%);
      border: 4px solid #444;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 2px 2px rgba(255,255,255,0.1);
      position: relative;
    }

    /* Rack Ears */
    .rack-unit::before, .rack-unit::after {
      content: "•";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      color: #666;
    }
    .rack-unit::before { left: -15px; }
    .rack-unit::after { right: -15px; }

    .display-screen {
      background: #001111;
      border: 3px inset #222;
      height: 150px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wave {
      width: 100%;
      height: 2px;
      background: #00ffcc;
      box-shadow: 0 0 15px #00ffcc;
      position: absolute;
      transition: transform 0.1s ease-out;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      text-align: center;
    }

    .knob-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .knob {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 30% 30%, #555, #222);
      border-radius: 50%;
      border: 2px solid #444;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
    }

    .knob::after {
      content: "";
      position: absolute;
      top: 10%;
      left: 50%;
      width: 4px;
      height: 15px;
      background: #00ffcc;
      transform: translateX(-50%);
    }

    .label {
      font-size: 10px;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #status {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }

    .hidden-art {
      position: absolute;
      width: 100px;
      opacity: 0;
      transition: opacity 0.5s;
      filter: grayscale(1) contrast(2);
    }
  </style>
</head>
<body>

  <div class="rack-unit">
    <div style="font-size: 10px; margin-bottom: 5px; color: #444;">AUDIO_VISUAL_DECODER // MK-II</div>
    
    <div class="display-screen" id="screen">
      <div class="wave" id="wave"></div>
      <div id="art-reveal" style="font-size: 14px; opacity: 0; text-align: center;">
        [ ENCRYPTION REVEALED ]<br>
        <span style="font-size: 10px;">ARTIST_FRIEND_SIG.PNG</span>
      </div>
    </div>

    <div class="controls">
      <div class="knob-container">
        <div class="knob" id="knob-freq" onclick="turnKnob('freq')"></div>
        <div class="label">Frequency</div>
      </div>
      <div class="knob-container">
        <div class="knob" id="knob-gain" onclick="turnKnob('gain')"></div>
        <div class="label">Gain</div>
      </div>
      <div class="knob-container">
        <div class="knob" id="knob-dist" onclick="turnKnob('dist')"></div>
        <div class="label">Distortion</div>
      </div>
    </div>
  </div>

  <div id="status">SIGNAL_STATE: SEARCHING...</div>

  <a href="index.html" style="margin-top: 40px; color: #444; text-decoration: none; font-size: 10px;">[ BYPASS UNIT ]</a>

  <script>
    let settings = { freq: 0, gain: 0, dist: 0 };
    const wave = document.getElementById('wave');
    const art = document.getElementById('art-reveal');
    const status = document.getElementById('status');

    function turnKnob(type) {
      settings[type] = (settings[type] + 45) % 360;
      document.getElementById(`knob-${type}`).style.transform = `rotate(${settings[type]}deg)`;
      updateSignal();
    }

    function updateSignal() {
      // Simulating a "sweet spot" at a specific knob configuration
      const isTuned = settings.freq === 180 && settings.gain === 90 && settings.dist === 225;

      if (isTuned) {
        wave.style.transform = "scaleY(0)";
        art.style.opacity = "1";
        status.innerText = "SIGNAL_STATE: DECODED // BITSTREAM SECURE";
        status.style.color = "#00ffcc";
        // You could trigger a small audio snippet here!
      } else {
        const noise = Math.random() * 20;
        wave.style.transform = `translateY(${noise}px) scaleY(${settings.gain / 10})`;
        art.style.opacity = "0";
        status.innerText = "SIGNAL_STATE: NOISE INTERFERENCE";
        status.style.color = "#666";
      }
    }
  </script>
</body>
</html>
