<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIC // DUNGEON.EXE</title>
  <link rel="icon" type="image/png" href="assets/icon2.gif">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
    }

    #dungeon-container {
      max-width: 600px;
      padding: 40px;
      border: 1px solid #fff;
      text-align: left;
      box-shadow: inset 0 0 10px #fff;
    }

    h1 {
      text-align: center;
      letter-spacing: 5px;
      text-transform: uppercase;
      border-bottom: 1px dashed #fff;
      padding-bottom: 10px;
      font-size: 1.5rem;
    }

    .premise-box {
      margin: 30px 0;
      line-height: 1.8;
      font-size: 1.1rem;
    }

    .premise {
      margin: 10px 0;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 40px;
    }

    .option-btn {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      padding: 15px;
      font-family: "Courier New", Courier, monospace;
      font-size: 1rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background: #fff;
      color: #000;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    /* The Punishment State */
    .punishment {
      background-color: #fff !important;
      color: #000 !important;
    }

    #spam-container {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      word-wrap: break-word;
      font-size: 10px;
      line-height: 10px;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div id="dungeon-container">
    <h1 id="room-title">CHAMBER 01</h1>
    
    <div class="premise-box" id="logic-prompt">
      </div>

    <div class="options" id="options-container">
      </div>
  </div>

  <div id="spam-container"></div>

  <script>
    const dungeonContainer = document.getElementById('dungeon-container');
    const roomTitle = document.getElementById('room-title');
    const promptContainer = document.getElementById('logic-prompt');
    const optionsContainer = document.getElementById('options-container');
    const spamContainer = document.getElementById('spam-container');
    const bodyEl = document.body;

    let currentRoom = 0;

    // The Logic Encounters
    const rooms = [
      {
        title: "CHAMBER 01",
        premises: [
          "P1: If you map the ports correctly, the site will deploy.",
          "P2: The site deployed."
        ],
        question: "Select the necessary conclusion:",
        choices: [
          { text: "Therefore, you mapped the ports correctly.", valid: false }, // Affirming the Consequent
          { text: "No valid conclusion can be drawn.", valid: true } 
        ]
      },
      {
        title: "CHAMBER 02",
        premises: [
          "P1: If the server crashes, the database corrupts.",
          "P2: The database did not corrupt."
        ],
        question: "Select the valid deduction:",
        choices: [
          { text: "Therefore, the server did not crash.", valid: true }, // Modus Tollens
          { text: "Therefore, the server crashed.", valid: false }
        ]
      },
      {
        title: "CHAMBER 03",
        premises: [
          "P1: Either we migrate to the new host, or we lose the domain.",
          "P2: We did not lose the domain."
        ],
        question: "Evaluate:",
        choices: [
          { text: "Therefore, we migrated to the new host.", valid: true }, // Disjunctive Syllogism
          { text: "Therefore, we did not migrate to the new host.", valid: false }
        ]
      },
      {
        title: "THE FINAL GATE",
        premises: [
          "P1: If the loop closes, the script terminates.",
          "P2: If the script terminates, the memory frees.",
          "P3: The memory did not free."
        ],
        question: "Derive the truth:",
        choices: [
          { text: "Therefore, the loop did not close.", valid: true }, // Hypothetical Syllogism + Modus Tollens
          { text: "Therefore, the loop closed.", valid: false }
        ]
      }
    ];

    function renderRoom() {
      if (currentRoom >= rooms.length) {
        victory();
        return;
      }

      const room = rooms[currentRoom];
      roomTitle.innerText = room.title;
      
      let promptHTML = "";
      room.premises.forEach(p => {
        promptHTML += `<div class="premise">${p}</div>`;
      });
      promptHTML += `<br><div><strong>${room.question}</strong></div>`;
      
      promptContainer.innerHTML = promptHTML;
      optionsContainer.innerHTML = "";

      // Shuffle options to prevent positional memorization
      const shuffledChoices = room.choices.sort(() => Math.random() - 0.5);

      shuffledChoices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `> ${choice.text}`;
        btn.onclick = () => handleChoice(choice.valid);
        optionsContainer.appendChild(btn);
      });
    }

    function handleChoice(isValid) {
      if (isValid) {
        currentRoom++;
        renderRoom();
      } else {
        triggerFallacyTrap();
      }
    }

    function triggerFallacyTrap() {
      // Hide the dungeon, show the pain
      dungeonContainer.style.display = 'none';
      bodyEl.classList.add('punishment');
      spamContainer.style.display = 'block';

      // Spam the background with text
      let spamText = "INVALID FORM. ";
      for (let i = 0; i < 5000; i++) {
        spamText += "FORMAL FALLACY DETECTED. ";
      }
      spamContainer.innerText = spamText;

      // The inescapable alert loop (capped at 15 so it doesn't crash modern browsers entirely, just annoys them)
      setTimeout(() => {
        for (let i = 0; i < 15; i++) {
          alert("ERROR: LOGIC FATAL. YOU AFFIRMED THE CONSEQUENT OR DENIED THE ANTECEDENT. YOU ARE TRAPPED IN THE DUNGEON.");
        }
        // Force them to reload to escape
        document.title = "TRAPPED TRAPPED TRAPPED";
      }, 100);
    }

    function victory() {
      roomTitle.innerText = "ESCAPE";
      promptContainer.innerHTML = "<div class='premise'>Your logic is sound. The proof is complete.</div>";
      optionsContainer.innerHTML = `
        <button class="option-btn" onclick="location.href='index.html'">> RETURN TO CAVE</button>
      `;
    }

    // Init
    renderRoom();
  </script>
</body>
</html>
